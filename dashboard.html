/* Layout concept: a drafting-desk index. Left, stage cards in running order; right, the tree for the open stage.
   Consolidated skill is the parent row; its steps and the original skills it was built from are the children. */
:root {
  --bg: #EDF0F2; --surface: #FAFBFC; --soft: #E3E8EC; --ink: #122028; --muted: #566771; --line: #D2DAE0;
  --accent: #1F4FD8; --accent-soft: #DDE6FB; --good: #1E7A4C; --warn: #9A5B00; --bad: #B3341F;
  --font-display: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161B; --surface: #17212A; --soft: #1F2C36; --ink: #E6ECF0; --muted: #93A4AF; --line: #2A3946;
    --accent: #7F9DFF; --accent-soft: #1E2A4A; --good: #5CC48D; --warn: #E0A23C; --bad: #F0806C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161B; --surface: #17212A; --soft: #1F2C36; --ink: #E6ECF0; --muted: #93A4AF; --line: #2A3946;
  --accent: #7F9DFF; --accent-soft: #1E2A4A; --good: #5CC48D; --warn: #E0A23C; --bad: #F0806C; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1260px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 2.4rem); line-height: 1.1; margin: 0; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 68ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.search { max-width: 520px; }
.search label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
.search input { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) {
  .layout { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: start; }
  .panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
}
.layout.solo { grid-template-columns: minmax(0, 1fr); }
.layout.solo .panel { position: static; max-height: none; max-width: 820px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); align-content: start; }
.card { text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card:hover { border-color: var(--muted); }
.card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.step { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.card h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.25; }
.card p { margin: 0; font-size: 13px; color: var(--muted); }
.meta { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: auto; font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
.panel h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 20px 0 6px; }
.phead { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
code, .mono { font-family: var(--font-mono); font-size: 12px; }
code { background: var(--soft); padding: 2px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.muted { color: var(--muted); }
details.node { border-top: 1px solid var(--line); }
details.node:last-of-type { border-bottom: 1px solid var(--line); }
details.node > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 16px 28px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 10px 0; }
details.node > summary::-webkit-details-marker { display: none; }
.chev { width: 16px; height: 16px; position: relative; margin-top: 3px; }
.chev::before { content: ""; position: absolute; inset: 4px 5px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform 0.12s; }
details[open] > summary .chev::before { transform: rotate(45deg); inset: 3px 5px 5px; }
.num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.ntitle { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.nsub { font-size: 13px; color: var(--muted); }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 3px; white-space: nowrap; }
.body { padding: 0 0 14px 52px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.grp { border-left: 2px solid var(--line); padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }
.glabel { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.grp ol, .grp ul { margin: 0; padding-left: 18px; }
.grp li { margin: 2px 0; }
.child { display: flex; flex-direction: column; }
.child small { color: var(--muted); }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-right: 4px; white-space: nowrap; }
.tag.post { background: var(--soft); color: var(--muted); }
a { color: var(--accent); }
.pipe { display: flex; flex-direction: column; gap: 0; }
.pstep { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; }
.prail { display: flex; flex-direction: column; align-items: center; }
.pdot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--accent); background: var(--surface); }
.pline { flex: 1; width: 2px; background: var(--line); min-height: 12px; }
.pbody { padding-bottom: 14px; min-width: 0; }
.gate { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--warn); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; margin-top: 6px; }
.gate::before { content: ""; width: 8px; height: 8px; border: 2px solid var(--warn); border-radius: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font: inherit; font-size: 12px; color: var(--ink); background: var(--soft); border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.chip:hover { background: var(--accent-soft); color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.empty { color: var(--muted); padding: 16px 0; }
.foot { color: var(--muted); font-size: 12px; }
@media (max-width: 560px) {
  details.node > summary { grid-template-columns: 16px minmax(0, 1fr); }
  details.node > summary .num, details.node > summary .count { grid-column: 2; padding-top: 0; }
  .body { padding-left: 24px; }
}
@media (prefers-reduced-motion: reduce) { .chev::before { transition: none; } }
</style>

of the problem.", "Fill the brief structure: overview, problem, audience, goals and success criteria, scope, constraints, existing inputs, deliverables and deadline.", "Write the out-of-scope list deliberately. Name the tempting adjacent work so it cannot creep in.", "List assumptions. Each is a hidden risk; mark which ones a stage could test.", "Audit the seven layers of thinking and rate each Strong, Partial, Assumed, Weak, Not started or N/A: observed behaviour, domain, user needs, product strategy, conceptual model, interaction flow, surface.", "Name the bottleneck: the lowest layer rated Weak, Assumed or Not started. Flag any layer treated as decided but rated Assumed.", "Recommend the stages to run, in order, with one reason each. Start at the bottleneck. If a deadline argues for skipping, say what risk that carries.", "Present the brief for gate G0 with `stage-gate`."], "draws_on": ["designer-skills/ux-strategy/design-brief", "layers-skills/layers/layers-orient", "ux-pgm-skills/program-planning/scoping-framework", "S04", "S11"], "version": "1.0", "updated": "2026-10-22"}, {"id": "00-governance/context-pack", "file": "00-governance/skills/context-pack.md", "slug": "context-pack", "stage": "00-governance", "order": 2, "step": 0, "name": "Build the context pack", "summary": "Assembles the small set of files an AI must read before it designs anything, so output follows the real project instead of generic defaults.", "fires_when": "Before any AI generates design work for a project; when output feels generic; when starting a new session on an existing project.", "inputs": ["work/00-brief.md", "work/01-research.md if present", "work/05-system/ if present"], "output": "work/context/ (project.md, plus pointers to DESIGN.md and UX.md)", "steps": ["Write `project.md`: the problem, audience, success criteria, scope, constraints and glossary terms, each in a line or two.", "Point to the sources of truth instead of copying them: `05-system/DESIGN.md` for visual rules, `05-system/UX.md` for research-backed UX rules, the component library.", "Order the pack by importance: hard constraints first, then the current task, then background. Models attend most to the start and the end.", "Separate hard constraints (must hold) from soft preferences (try to hold), and state which wins when they clash, for example \"accessibility over brevity\".", "Remove anything stale, duplicated or generic. Every line should change an output if removed.", "List what the AI must not do on this project: banned patterns, off-brand choices, unapproved claims.", "Test it: ask the AI to restate the problem and three constraints from the pack. Fix any gap it reveals."], "draws_on": ["ai-design-skills/prompt-architecture/context-engineering", "ai-design-skills/prompt-architecture/constraint-specification", "S08", "S12", "S13", "S29", "S46"], "version": "1.0", "updated": "2026-10-22"}, {"id": "00-governance/stage-gate", "file": "00-governance/skills/stage-gate.md", "slug": "stage-gate", "stage": "00-governance", "order": 3, "step": null, "name": "Run a stage gate", "summary": "Stops the line at the end of each stage so a person checks the evidence and decides, instead of letting AI speed carry weak assumptions forward.", "fires_when": "A stage finishes; before moving to the next stage; when someone asks \"can we move on\" or \"is this ready\".", "inputs": ["the stage's output file", "the gate checklist for that stage"], "output": "work/decisions.md (gate entry)", "steps": ["Load the checklist for this gate.", "Check each item against the output. Mark pass, fail or not applicable, with the evidence.", "Run `ai-output-check` on AI-produced content in the output.", "Present a one-screen summary: what passed, what failed, what is assumed, and the decision needed.", "Wait for a person to choose: proceed, proceed with named risks, rework, or stop.", "Record the decision with `decision-log`."], "draws_on": ["designer-skills/design-ops/design-review-process", "ai-design-skills/design-agent-orchestration/human-in-the-loop", "S11", "S12", "S25"], "version": "1.0", "updated": "2026-10-22"}, {"id": "00-governance/decision-log", "file": "00-governance/skills/decision-log.md", "slug": "decision-log", "stage": "00-governance", "order": 4, "step": null, "name": "Log a decision", "summary": "Records what was decided and why, so settled questions stay settled and later sessions (human or AI) inherit the reasoning.", "fires_when": "A choice is made between options; a gate is passed; something is deliberately not done; a pattern departs from the norm.", "inputs": ["the decision", "options considered", "evidence"], "output": "work/decisions.md", "steps": ["Write the decision plainly and specifically.", "Add the context: the problem and constraints that prompted it.", "List the options considered and why each was rejected, so they are not re-proposed.", "Cite the evidence: research findings, data, standards, test results, skill IDs.", "State the trade-offs accepted and who they affect.", "Name the decider and date. A decision without a decider is not one.", "Set a revisit trigger: a date, a metric threshold or \"permanent\"."], "draws_on": ["designer-skills/designer-toolkit/design-rationale", "inclusive-design-skills/accessibility-decisions/decision-documentation", "ux-pgm-skills/cross-functional-alignment/decision-log", "S07"], "version": "1.0", "updated": "2026-10-22"}, {"id": "00-governance/ai-output-check", "file": "00-governance/skills/ai-output-check.md", "slug": "ai-output-check", "stage": "00-governance", "order": 5, "step": null, "name": "Check AI output", "summary": "A quick, consistent quality check on anything an AI produced, before people rely on it.", "fires_when": "Any AI-produced research summary, copy, spec, screen or code is about to be shown to a person or used by the next stage.", "inputs": ["the AI output", "the context pack", "its source material"], "output": "notes added to the stage output; failures logged in work/decisions.md", "steps": ["Score five dimensions from 1 to 5: accuracy (claims verifiable, nothing invented), relevance (answers the actual task), completeness (no gaps against the inputs), clarity, and fit (tone, brand, constraints).", "Trace claims. Every user insight, quote, number or standard must point to a source in the inputs. Mark anything without one as unverified.", "Classify any failure: invented content, wrong detail, missing content, off-task, contradiction, wrong format, generic output, tone mismatch, or a safety or privacy issue.", "Set severity: critical (could mislead or harm), high (would derail the next stage), medium (needs a fix), low (note it).", "For products that affect people, ask who could be harmed, how, how likely and how severe, and write a testable mitigation for anything likely or severe.", "Fix or return the output. Critical and high failures block the gate."], "draws_on": ["ai-design-skills/evaluation/output-quality-rubrics", "ai-design-skills/evaluation/failure-taxonomy", "ai-design-skills/ai-alignment-reasoning/harm-anticipation", "S15"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/research-plan", "file": "01-research/skills/research-plan.md", "slug": "research-plan", "stage": "01-research", "order": 1, "step": 1, "name": "Plan the research", "summary": "Turns \"we should understand users\" into two or three sharp questions, checks what is already known, and picks the cheapest method that can answer them.", "fires_when": "Starting research; \"what should we find out\", \"plan a study\", \"do we need interviews or a survey\"; the brief's bottleneck is observed behaviour or user needs.", "inputs": ["work/00-brief.md", "existing research or analytics in work/inputs/"], "output": "work/01-research.md#plan", "steps": ["Get clarity. Agree the decision this research serves, who makes it and by when. Work back from that date.", "List what you know and what you do not. Separate evidence from team belief. Mark each known item observed, inferred or assumed.", "Brainstorm questions before methods. Keep a running list. Research questions are not interview questions; they are what you need to learn.", "Pick two or three priority questions. Prefer the ones that block work or carry the most risk. Push past \"understand users better\" to something specific, such as \"what makes someone hesitate before inviting a colleague\".", "Refine each question. Do you need ideas or a description of real behaviour? Are you evaluating a solution or testing cause and effect? Qualitative or quantitative? Agree how much evidence is enough.", "Choose the method that produces that evidence:", "Plan analysis before collection. Decide how notes will be tagged (one observation per note, tied to a question) and who synthesises.", "Plan how findings will be shared and where they will live (`01-research.md` and `05-system/UX.md`)."], "draws_on": ["layers-skills/layers/layers-observed-behaviour", "designer-skills/design-research/diary-study-plan", "designer-skills/design-research/survey-design", "S04"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/interview-guide", "file": "01-research/skills/interview-guide.md", "slug": "interview-guide", "stage": "01-research", "order": 2, "step": 1, "name": "Write an interview guide", "summary": "Produces a non-leading interview guide that gets people to describe real past experiences, so you learn what they do and why, not what they think they might do.", "fires_when": "Interviews are planned; \"write the interview script\", \"what should we ask users\".", "inputs": ["work/01-research.md#plan"], "output": "work/01-research.md#interview-guide", "steps": ["Confirm the priority questions, the participants and the length (usually 45 to 60 minutes).", "Structure the session:", "Write probes for every core question: \"Tell me more\", \"Why did that matter?\", \"What did you do then?\", \"Can you show me?\"", "Ask about emotional and social sides as well as practical ones: how they felt, who else was involved, how it looked to others.", "Look for workarounds: spreadsheets, notes, emails to self. A workaround marks a real need.", "Test every question. Rewrite any that leads (\"Was that frustrating?\" becomes \"How did that feel?\"), assumes (\"Would you use...\"), or allows a plain yes or no.", "Add facilitator notes: stay neutral, let silences run, park tangents, watch the time."], "draws_on": ["designer-skills/design-research/interview-script", "layers-skills/layers/layers-user-needs"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/synthesise-findings", "file": "01-research/skills/synthesise-findings.md", "slug": "synthesise-findings", "stage": "01-research", "order": 3, "step": 1, "name": "Synthesise findings", "summary": "Turns raw research into findings the team can trust and reuse: grounded in evidence, marked for confidence, and honest about gaps.", "fires_when": "Research material exists (transcripts, notes, tickets, survey results, analytics); \"make sense of this research\", \"what did we learn\", \"summarise these interviews\".", "inputs": ["raw research in work/inputs/", "work/01-research.md#plan"], "output": "work/01-research.md#findings, and the research section of work/05-system/UX.md", "steps": ["Index every source evenly. Give each participant or source an ID (P1, P2...). Read all of them before grouping. AI tends to build themes from the first one or two transcripts; do not.", "Extract observations. One per note: what someone said, did or felt, as close to verbatim as possible, tagged with source ID and the research question it speaks to. No interpretation yet.", "Group from the bottom up. Cluster by recurring situations, motivations, anxieties and workarounds. Do not start with categories.", "Name clusters and write insight statements. One clear sentence each, with the \"so what\" for design.", "Mark confidence. Observed (a quotable piece of evidence supports it), inferred, or assumed. Note how many sources support each insight. Flag single-source patterns; do not discard them.", "Check coverage. Every participant should appear somewhere. If one is missing, go back.", "Triangulate. Where analytics and research disagree, treat the disagreement as information. Data answers what happened, how often and where; research answers why. Check both describe the same population. Weight what people did over what they said. Do not average the two into a middle finding.", "Flag gaps as open questions for a follow-up plan.", "Prioritise insights by their impact on decisions.", "Hand over. Write findings to `01-research.md` and copy the decision-relevant ones into `UX.md` as guardrails for later stages."], "draws_on": ["designer-skills/design-research/summarize-interview", "designer-skills/design-research/affinity-diagram", "designer-skills/design-research/qual-quant-triangulation", "designer-skills/design-research/research-repository", "layers-skills/layers/layers-observed-behaviour"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/needs-and-jobs", "file": "01-research/skills/needs-and-jobs.md", "slug": "needs-and-jobs", "stage": "01-research", "order": 4, "step": 1, "name": "Define needs and jobs", "summary": "Turns findings into prioritised needs, pains and desires, written as job stories that keep solutions out.", "fires_when": "After synthesis; \"what are users trying to do\", \"write job stories\", \"what are the needs and pains\".", "inputs": ["work/01-research.md#findings"], "output": "work/01-research.md#needs", "steps": ["Settle who and when. Name the user type and situation. If there are distinct types with different needs, work them separately.", "Write job stories: \"When [situation], I want to [motivation], so I can [outcome].\"", "Cover three kinds of job: functional (the task), emotional (how they want to feel or avoid feeling) and social (how they want to be seen). Emotional and social jobs are usually missed unless asked about directly.", "List pains and desires alongside needs.", "Map current solutions. What do people use or improvise now? Workarounds signal strong needs.", "Mark confidence for each: observed, inferred or assumed.", "Prioritise roughly by importance times how poorly it is served today. Keep it rough; precise scoring belongs in strategy.", "Optionally, summarise as an empathy map (says, thinks, does, feels) for stakeholders, built only from evidence."], "draws_on": ["designer-skills/design-research/jobs-to-be-done", "layers-skills/layers/layers-user-needs", "designer-skills/design-research/empathy-map"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/inclusive-personas", "file": "01-research/skills/inclusive-personas.md", "slug": "inclusive-personas", "stage": "01-research", "order": 5, "step": 1, "name": "Build inclusive personas", "summary": "Creates two to four research-based personas built on behaviour, with disability, situational limits and context of use woven in from the start.", "fires_when": "The team needs a shared reference for who it designs for; \"create personas\"; before UX work on a product with several user types.", "inputs": ["work/01-research.md#findings", "work/01-research.md#needs"], "output": "work/01-research.md#personas", "steps": ["Cluster behaviour patterns from the findings: motivations, approaches, confidence, context. Personas come from behaviour, not demographics.", "Define two to four personas. For each: a name, a one-line quote from research, context, goals (functional, emotional, social), frustrations, current behaviour, a short scenario and design implications.", "Weave in ability. Write disability into the person, with their assistive technology and how it shapes good and bad experiences, never as a separate \"accessibility persona\".", "Add context of use to every persona: environment, devices, energy level, who else is present, and the situational limits that come with it (glare, noise, one hand busy, time pressure, second language, stress).", "Apply the minimum mix for four or more personas: at least one with a permanent disability, one in a situational limit, two differing in technical confidence, and variety in age, language and context.", "For the core tasks, map how each works across ability ranges (vision, hearing, motor, cognitive): works well, works with friction, needs a workaround, or fails. Mark where it starts to fail.", "Name the primary persona the design must satisfy first, with the reason.", "List the research gaps behind each persona."], "draws_on": ["designer-skills/design-research/user-persona", "inclusive-design-skills/inclusive-personas/disability-inclusive-personas", "inclusive-design-skills/inclusive-personas/ability-spectrum-mapping", "inclusive-design-skills/inclusive-personas/situational-impairment-mapping"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/journey-map", "file": "01-research/skills/journey-map.md", "slug": "journey-map", "stage": "01-research", "order": 6, "step": 1, "name": "Map the journey", "summary": "Shows an end-to-end experience for one persona and scenario, with emotions, pain points and the moments that make or break it. Scales up to an experience map or service blueprint when needed.", "fires_when": "Improving an existing experience; \"map the journey\", \"where does it go wrong end to end\"; an experience spans several channels or involves staff.", "inputs": ["work/01-research.md#findings", "#personas"], "output": "work/01-research.md#journeys", "steps": ["Set scope: persona, scenario, start and end points, current state or future state. Map the current state first.", "Define five to seven stages from the user's point of view.", "For each stage, record: goal, actions, touchpoints and channels, thoughts and questions, emotion (rated positive to negative), pain points and opportunities.", "Draw the emotional curve and mark the moments of truth.", "For an experience map, add how touchpoints connect, data passing between channels, and hand-offs between people and automation.", "For a service blueprint, add lanes beneath the user's actions: what staff or systems do that users see (frontstage), what they do out of sight (backstage) and the support processes behind them. Mark the line of visibility.", "Rank the top three to five opportunities by impact and feasibility."], "draws_on": ["designer-skills/design-research/journey-map", "designer-skills/ux-strategy/experience-map", "designer-skills/ux-strategy/service-blueprint"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/competitive-scan", "file": "01-research/skills/competitive-scan.md", "slug": "competitive-scan", "stage": "01-research", "order": 7, "step": 1, "name": "Scan the competition", "summary": "Studies how others solve the same job to find table-stakes patterns, gaps and better ideas, judged on experience quality rather than feature lists.", "fires_when": "Entering a market or redesigning a known pattern; \"what do others do\", \"benchmark this\".", "inputs": ["work/00-brief.md"], "output": "work/01-research.md#competitors", "steps": ["Pick five to eight products: direct competitors (same problem, same audience), indirect ones (same problem, different audience) and one or two best-in-class examples from other fields.", "Choose the key tasks to compare, taken from the needs or the brief.", "Walk each task end to end in each product. Use real product flow libraries (for example Mobbin or Page Flows) where you cannot sign up (S21).", "Record per task: supported or not, number of steps, experience quality (1 to 5), notable approaches, accessibility issues seen.", "Note how each product names things. Conflicting vocabulary feeds `domain-glossary`.", "Summarise: table stakes (everyone does it, users expect it), weaknesses everyone shares (opportunity), and distinctive approaches worth learning from."], "draws_on": ["designer-skills/ux-strategy/competitive-analysis", "S21"], "version": "1.0", "updated": "2026-10-22"}, {"id": "01-research/domain-glossary", "file": "01-research/skills/domain-glossary.md", "slug": "domain-glossary", "stage": "01-research", "order": 8, "step": 1, "name": "Map the domain and glossary", "summary": "Maps the real-world concepts, words and processes users bring with them before any product exists, so the product's model and copy match how people think.", "fires_when": "The domain is complex or unfamiliar; teams or users use different words for the same thing; before the conceptual model.", "inputs": ["work/01-research.md#findings", "domain documents in work/inputs/"], "output": "work/01-research.md#domain, glossary section of work/05-system/UX.md", "steps": ["Ask what domain this is, who works in it, and what they are trying to do before your product enters the picture.", "Harvest nouns from research, documents and interviews. Mark each: object (many can exist, it has its own attributes, people care about it), attribute, instance or value, or unclear.", "Audit terminology. For each concept: the names used, who uses which, and whether the clash is two words for one thing or one word for two things. Do not pick a winner yet.", "Mark the seams where groups share words internally but differ from each other.", "Sketch relationships with a simple concept map when they are unclear.", "For process-heavy domains, list key events in past tense on a timeline (\"order placed\", \"refund approved\") with their triggers.", "Note where this map is the team's belief rather than researched fact.", "Write the glossary into `UX.md`: term, definition, synonyms in use, and who uses it."], "draws_on": ["layers-skills/layers/layers-domain", "S13"], "version": "1.0", "updated": "2026-10-22"}, {"id": "02-ideation/frame-problem", "file": "02-ideation/skills/frame-problem.md", "slug": "frame-problem", "stage": "02-ideation", "order": 1, "step": 2, "name": "Frame the problem", "summary": "Connects one measurable outcome to the user opportunities that can move it, then narrows to the problem worth solving now.", "fires_when": "Research is done and the team must choose what to solve; \"which problem do we tackle\", \"how might we\", \"what is the opportunity\".", "inputs": ["work/00-brief.md", "work/01-research.md#needs", "#journeys", "#competitors"], "output": "work/02-direction.md#problem", "steps": ["Set one outcome. Measurable, meaningful and bounded: \"more new users activate within 30 days\", not \"grow the product\". One outcome per frame. Note which business line it moves (conversion, retention, order value, support cost, churn).", "List opportunities from the needs and journey work, in the user's first-person words, anchored to a journey moment: \"I do not know which plan covers this.\" Apply the flip test: if it reads as \"I need [your feature]\", it is a solution in disguise.", "Keep only opportunities that move the outcome. If serving it would not shift the outcome, park it.", "Group by journey moment and draw the tree: outcome at the top, opportunities beneath.", "Prioritise by importance times how poorly it is served, adjusted for evidence strength. Use a second lens to check (impact against effort, or RICE: reach, impact, confidence, effort). Where lenses disagree, discuss why.", "Write the problem statement for the chosen opportunity: who, situation, what gets in the way, evidence, and the cost of leaving it.", "Write two or three \"how might we\" questions that open the solution space without naming a solution."], "draws_on": ["layers-skills/layers/layers-product-strategy", "designer-skills/ux-strategy/opportunity-framework", "S03"], "version": "1.0", "updated": "2026-10-22"}, {"id": "02-ideation/assumptions-and-bets", "file": "02-ideation/skills/assumptions-and-bets.md", "slug": "assumptions-and-bets", "stage": "02-ideation", "order": 2, "step": 2, "name": "Place bets and test assumptions", "summary": "Generates several solution bets for the chosen opportunity, names the assumption each depends on, and designs the cheapest test for the riskiest one.", "fires_when": "A problem is framed; \"what could we build\", \"what is the riskiest assumption\", \"how do we test this cheaply\".", "inputs": ["work/02-direction.md#problem"], "output": "work/02-direction.md#bets", "steps": ["Write at least three bets: \"We could [solution], which we believe would [serve the opportunity] because [reasoning].\" More than one bet per opportunity, always.", "For each bet, name the riskiest assumption across four kinds: will people want it (desirability), can we build it (feasibility), does it pay (viability), can people use it (usability).", "Rank assumptions by how much rides on them and how little evidence exists.", "Design the cheapest test for the top one, in days not months: a fake door, a concierge run, a clickable prototype, a five-person interview round, or a look at existing data.", "Write the test as a falsifiable claim: what result would kill the bet.", "State each bet in business terms: which metric it moves, and the cost of not doing it. Separate evidence from craft judgement and say which is which.", "Defer the bets you will not pursue now, with the reason."], "draws_on": ["layers-skills/layers/layers-product-strategy", "designer-skills/ux-strategy/business-design", "designer-skills/ux-strategy/opportunity-framework"], "version": "1.0", "updated": "2026-10-22"}, {"id": "02-ideation/design-principles", "file": "02-ideation/skills/design-principles.md", "slug": "design-principles", "stage": "02-ideation", "order": 3, "step": 2, "name": "Set design principles", "summary": "Writes three to five principles specific enough to settle real arguments, ranked so they resolve conflicts. Optionally adds a short north-star statement for long-horizon work.", "fires_when": "The same trade-offs keep being argued; a new product or major redesign starts; \"what are our principles\", \"what is the vision\".", "inputs": ["work/01-research.md#findings", "work/02-direction.md#problem"], "output": "work/02-direction.md#principles, and the principles section of work/05-system/UX.md", "steps": ["Gather inputs: research findings, product strategy, brand values, past decisions that went badly.", "Draft candidates. For each, ask \"would anyone sensible disagree?\" If not, it is a platitude (\"make it simple\") and needs a stance (\"show the total before asking for details\").", "Write each principle as: a title of three to six words, a one-line statement, the reason (linked to evidence), an example of applying it, a counter-example, and the trade-off it accepts.", "Rank them. When two collide, the higher one wins.", "Test against three past or current decisions. A principle that would not have changed any of them is decoration.", "If the work is long-horizon, add a north star: one sentence on who, what experience and why it matters, with three to five pillars and a one-paragraph future scenario."], "draws_on": ["designer-skills/ux-strategy/design-principles", "designer-skills/ux-strategy/north-star-vision"], "version": "1.0", "updated": "2026-10-22"}, {"id": "02-ideation/explore-concepts", "file": "02-ideation/skills/explore-concepts.md", "slug": "explore-concepts", "stage": "02-ideation", "order": 4, "step": 2, "name": "Explore concepts in parallel", "summary": "Builds a small set of genuinely different concepts at equal effort before choosing, because parallel exploration beats refining the first idea.", "fires_when": "A problem is framed and there is one idea on the table (or none); \"give me options\", \"explore directions\", \"sketch some concepts\".", "inputs": ["work/02-direction.md#problem", "#bets", "#principles"], "output": "work/02-direction.md#concepts", "steps": ["Write the question the set must answer, for example \"should the user commit before or after seeing the price?\"", "Choose the dimension the concepts must differ on. The test is behavioural: does the user do something different? Useful dimensions are sequence (what is asked first), unit of work (one item, a batch, a stream), division of labour (what the person decides versus the system), entry point, and commitment point.", "Create three concepts as a default. Three cheap sketches beat two polished mockups.", "Give every concept a fair effort. No strawmen. Do not carry a concept nobody would build.", "Keep fidelity and visual style the same across the set, so the difference under test stays isolated. Match fidelity to the question: sketches or flows for structure, a clickable prototype for interaction, coded or high-fidelity only for visual or motion questions.", "Describe each concept in a few lines plus a flow or sketch: what the user does, what it tests that the others do not, and its main risk.", "If AI generates concepts, check they differ in behaviour, not only appearance. Two layouts of the same steps are one concept; replace one."], "draws_on": ["designer-skills/prototyping-testing/parallel-concepts", "designer-skills/prototyping-testing/prototype-strategy"], "version": "1.0", "updated": "2026-10-22"}, {"id": "02-ideation/select-concept", "file": "02-ideation/skills/select-concept.md", "slug": "select-concept", "stage": "02-ideation", "order": 5, "step": 2, "name": "Select a concept", "summary": "Chooses one direction on criteria fixed in advance and records why the others lost, so preference is not passed off as reasoning.", "fires_when": "Concepts exist and a direction must be chosen; \"which one do we go with\", \"help us decide\".", "inputs": ["work/02-direction.md#concepts", "#problem", "#principles", "success criteria from the brief"], "output": "work/02-direction.md#decision, work/decisions.md", "steps": ["Name the decider before the review.", "Write the criteria before comparing. Take them from the success criteria and principles. Each must be able to fail a concept: \"completes the core task in three steps or fewer\", not \"better UX\".", "Mark each criterion as a threshold (fail it and the concept is out) or a trade-off (weighed against others).", "Re-level fidelity if needed. Polish should not decide.", "Apply every criterion to every concept, including the current design if there is one. Use evidence (test results, constraints) over the number of people who liked something.", "If two concepts each win on different criteria, the criteria conflict. Escalate the priority question; do not average the two into a compromise.", "Choose one. State what it costs and what would make you revisit it.", "For each rejected concept, record what it tested, what it lost on and what would bring it back.", "Pass gate G2 with `stage-gate`, then log with `decision-log`."], "draws_on": ["designer-skills/prototyping-testing/concept-selection"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/conceptual-model", "file": "03-ux-design/skills/conceptual-model.md", "slug": "conceptual-model", "stage": "03-ux-design", "order": 1, "step": 3, "name": "Define the conceptual model", "summary": "Decides the objects the product recognises, how they relate, what users can do to them, what states they pass through, and one name for each. It is the most neglected layer, and every flow and screen above depends on it.", "fires_when": "Before flows or screens; \"what are the objects\", \"what do we call this\"; naming arguments; a redesign where the product feels inconsistent.", "inputs": ["work/01-research.md#domain", "#needs", "work/02-direction.md#decision"], "output": "work/03-ux-spec.md#model, vocabulary section of work/05-system/UX.md", "steps": ["Harvest candidate objects from the noun list, the needs and the chosen concept. Sort into objects, attributes, instances or values, and set-aside (UI elements, vague abstractions).", "Test each object. A real object can have many instances, has its own attributes, and users care about it in its own right. Being able to be an object does not mean it should be first-class; justify each promotion.", "Define each object: one sentence from the user's view, its attributes, its relationships (how many, and the role where it plays several: \"belongs to one user, as referrer\"), and its actions. Where an attribute is just another object's name, model it as a relationship.", "Trace everything to a need. Remove objects, attributes or actions that serve no stated need.", "Model states for any object whose status changes what users can do: list states, events that move between them, guards, and what each state forbids. Check there are no impossible states and every state has a way out.", "Inventory actions across all objects in one list. Fix inconsistent verbs (Add, Create and New for one operation) and generic verbs that hide different outcomes (\"edit address\" for a typo versus a house move).", "Settle vocabulary: for each contested concept, the chosen term, rejected alternatives and why. One name per concept, one concept per name, in UI, help and code alike.", "Probe time: what happens to history, deletion, and things that referred to a deleted object."], "draws_on": ["layers-skills/layers/layers-conceptual-model", "designer-skills/interaction-design/state-machine"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/information-architecture", "file": "03-ux-design/skills/information-architecture.md", "slug": "information-architecture", "stage": "03-ux-design", "order": 2, "step": 3, "name": "Structure the information architecture", "summary": "Organises content and features into a structure and navigation that match how users think, so they always know where they are, where they can go and how to get back.", "fires_when": "Organising content or features; designing navigation; \"where does this live\", \"users cannot find X\"; content volume is growing.", "inputs": ["work/03-ux-spec.md#model", "work/01-research.md#domain", "card sort or tree test data if any"], "output": "work/03-ux-spec.md#ia", "steps": ["Audit what exists: inventory screens, sections and content types. Flag orphans, duplicates and dead ends.", "Design from tasks inward, not from the homepage outward or from the org chart.", "Define content types from the conceptual model: attributes and relationships.", "Label from user language. Use card sorts (open for new structures, closed to validate) and the glossary. Test labels with users, not colleagues.", "Draft the hierarchy. Prefer moderate depth with clear labels; keep primary content within three levels.", "Choose navigation patterns:", "Design wayfinding for memory and attention limits: page titles match the link that led there, the current location is always marked (not by colour alone), step indicators in multi-step flows, important actions within two clicks, more than one route to key content (search, browse, shortcuts).", "Validate with a tree test or first-click test on key tasks before building."], "draws_on": ["designer-skills/ux-strategy/information-architecture", "designer-skills/design-research/card-sort-analysis", "designer-skills/interaction-design/navigation-patterns", "inclusive-design-skills/cognitive-accessibility/wayfinding-navigation"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/user-flows", "file": "03-ux-design/skills/user-flows.md", "slug": "user-flows", "stage": "03-ux-design", "order": 3, "step": 3, "name": "Map user flows", "summary": "Settles the interaction logic of a flow, with every place, action, destination and edge case, before visual design makes changes expensive.", "fires_when": "Designing how a user completes a job; \"map the flow\", \"what are the steps\", \"what happens if it fails\"; before wireframes.", "inputs": ["work/03-ux-spec.md#model", "#ia", "the job story being served"], "output": "work/03-ux-spec.md#flows", "steps": ["Name the job story, the starting point and what success looks like. For a redesign, describe the current flow first.", "Breadboard the flow in text:", "Every action needs a named destination. \"Submit, then where?\" An unnamed destination is an unmade decision.", "Map the edges as required steps: validation failure, server error, lost connection, timeout, someone else editing at the same time, empty states, loading, the state after the action, cancel and back.", "Walk it as the user: \"I am [situation], I arrive at [place], I see [content], I want to [motivation], so I [action].\" Walk the happy path, then each edge.", "Check the model: each object's attributes and actions are available together, relationships are navigable, and words match the vocabulary.", "Plan every input method: each action works by keyboard, pointer or touch, and voice where relevant. Note focus order, focus handling for dialogs and dynamic content, and target sizes. Flag any action that only works one way.", "Simplify. More than five or six places for one job story is a sign something can merge.", "Add a flow diagram if it helps orientation; the breadboard stays the main record."], "draws_on": ["layers-skills/layers/layers-interaction-flow", "designer-skills/prototyping-testing/user-flow-diagram", "inclusive-design-skills/inclusive-interaction/design-flow"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/states-and-errors", "file": "03-ux-design/skills/states-and-errors.md", "slug": "states-and-errors", "stage": "03-ux-design", "order": 4, "step": 3, "name": "Design states, feedback and errors", "summary": "Specifies every state a screen or component can be in, the feedback for every action, and how errors are prevented, explained and recovered from.", "fires_when": "Any flow or component is specified; \"what does it show while loading\", \"write the error states\", \"what if it fails\"; before handoff.", "inputs": ["work/03-ux-spec.md#flows", "#model"], "output": "work/03-ux-spec.md#states", "steps": ["List the states per screen and component: empty (first use, no results, cleared), loading, partial, success, error, offline, disabled, and permission denied. Make impossible combinations impossible (never loading and error at once). Every state has a way out.", "Loading by duration: under 0.1 s show nothing; up to 1 s a subtle change or skeleton; 1 to 10 s a clear indicator with progress if known; over 10 s progress, an estimate and the option to leave it running. Never show a blank screen. Match skeletons to real content. Avoid layout shift.", "Feedback for every action, as close to the action as possible: inline first, then component, page, then system notification. Use more than colour (text, icon, shape) and make status changes announceable to screen readers. Toasts for minor confirmations disappear after 3 to 5 seconds; errors stay until fixed.", "Prevent errors first: forgiving input (accept several date and phone formats, trim spaces), smart and safe defaults, constrained inputs, autosave, and asking only for what is needed.", "Write error messages that answer three questions: what happened, why (if useful), and what to do now. Never blame the user. \"Enter a date like 15/03/2026\", not \"Invalid input\".", "Design recovery: keep the user's input, offer retry for temporary failures, give an alternative path, and prefer undo over \"are you sure?\". For destructive actions, confirm with specifics: \"Delete 'Project Alpha'? This removes 23 files and cannot be undone.\"", "Design empty states as guidance: what will appear here, why it is empty, and the first action to take."], "draws_on": ["designer-skills/interaction-design/state-machine", "designer-skills/interaction-design/loading-states", "designer-skills/interaction-design/error-handling-ux", "designer-skills/interaction-design/feedback-patterns", "inclusive-design-skills/cognitive-accessibility/error-prevention-recovery"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/form-design", "file": "03-ux-design/skills/form-design.md", "slug": "form-design", "stage": "03-ux-design", "order": 5, "step": 3, "name": "Design forms", "summary": "Designs forms that ask for less, are easy to complete and accessible, and recover gracefully from mistakes.", "fires_when": "Any form, sign-up, checkout or data entry; \"people drop out of this form\", \"design the form\".", "inputs": ["work/03-ux-spec.md#flows", "#model"], "output": "work/03-ux-spec.md#forms", "steps": ["Cut fields. Remove everything not needed now; defer the rest. Each field costs completions.", "Single column, with field width hinting at the expected length.", "Visible labels above fields, always. Placeholder text is never the only label. Put format hints in the label or help text (\"Date of birth (DD/MM/YYYY)\").", "Mark optional fields, not required ones; most fields should be required by design.", "Pick the right input: radios for up to five visible options, a select or combobox for more, checkboxes for several choices, segmented or picker inputs for dates, masked inputs for phone and card numbers, a show-and-hide toggle for passwords.", "Group related fields under headings, with fieldsets and legends for radio and checkbox groups.", "Validate when the user leaves a field, not while typing. Put errors directly under the field, linked to it for screen readers. Show success where correctness is not obvious (password strength, username free). For several errors on submit, add a focusable summary at the top that links to each field.", "Multi-step forms: clear progress, related questions together, back without losing data, save and continue for long forms, confirm before discarding.", "Accessibility: programmatic labels, help text linked to the field, focus order matching visual order, nothing signalled by colour alone.", "Write the copy with `ux-writing`."], "draws_on": ["designer-skills/interaction-design/form-design", "inclusive-design-skills/accessible-content/form-labelling"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/ux-writing", "file": "03-ux-design/skills/ux-writing.md", "slug": "ux-writing", "stage": "03-ux-design", "order": 6, "step": 3, "name": "Write interface copy", "summary": "Writes clear, plain interface copy in the product's voice that uses the model's vocabulary and helps people act.", "fires_when": "Labels, buttons, errors, empty states, onboarding or help text are needed; \"write the copy\", \"what should this button say\", \"review this microcopy\".", "inputs": ["work/03-ux-spec.md#model vocabulary", "#states", "voice and tone from work/05-system/UX.md"], "output": "work/03-ux-spec.md#copy", "steps": ["Use the vocabulary. One name per concept, as decided in the conceptual model. Never internal jargon.", "Set voice and tone. Voice stays constant; tone shifts with context (reassuring in errors, brief in success, neutral in legal text). Record examples and counter-examples.", "Write by type:", "Keep it plain. One idea per sentence, 15 to 20 words at most, active voice, everyday words. Aim for a reading age of about 11 to 13 for the public and simpler still for buttons and errors.", "Remove filler and AI tells: throat-clearing openers, intensifiers, \"not just X, it is Y\" constructions, stacked adjectives and vague claims. See `slop-check` (06).", "Check with real content: longest names, translations (allow about 30 per cent extra length), screen-reader reading order."], "draws_on": ["designer-skills/designer-toolkit/ux-writing", "designer-skills/ux-strategy/content-strategy", "inclusive-design-skills/cognitive-accessibility/plain-language-design", "inclusive-design-skills/accessible-content/link-text-design", "stop-slop/writing/stop-slop"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/ai-experience", "file": "03-ux-design/skills/ai-experience.md", "slug": "ai-experience", "stage": "03-ux-design", "order": 7, "step": 3, "name": "Design the AI experience", "summary": "Specifies how an AI feature behaves for users: who leads, how confident it sounds, what it shows about its sources and limits, what it can generate, and what happens when it fails or should hand over.", "fires_when": "The product has an AI feature (assistant, generation, recommendations, agents); \"design the AI feature\", \"how should the AI behave\", \"what happens when it is wrong\".", "inputs": ["work/03-ux-spec.md#flows", "#states", "work/02-direction.md#decision"], "output": "work/03-ux-spec.md#ai-behaviour", "steps": ["Decide who leads at each step. The user leads for judgement calls, high stakes, expertise or consent. The AI can lead when the user is exploring, the steps are well known, or they asked for help. Make each hand-over explicit, so it is always clear whose turn it is.", "Calibrate trust. Match confidence wording to real certainty. Show sources where possible; say when there are none. Offer alternatives with the reason for the choice. State what it can and cannot do. Avoid hedging everything, and avoid confident formatting on uncertain output.", "Decide what to make visible: that it is AI, sources, confidence, limits and reasoning. Show more when stakes are high or confidence is low; let users drill in rather than showing everything.", "Constrain generated UI to the design system: allowed components, layout and style rules, interaction patterns and accessibility. Define a fallback when generation fails, and use plain text when it is clearer.", "Design the extra states AI adds: thinking or working, streaming, partial result, low confidence, refused, can't answer, error, stopped by user, and corrected after feedback.", "Design failure handling: retry with a limit, fall back, deliver a partial result and say what is missing, or fail honestly with alternatives. Let users stop, undo and edit.", "Design escalation: triggers (low confidence, high stakes, distress, out of scope, policy, unresolved disagreement), where it goes (a person, a specialist, or back to the user), carrying the full context so users never repeat themselves, and what happens next.", "Plan feedback capture: how users correct, rate or report outputs, and what changes as a result."], "draws_on": ["ai-design-skills/ai-alignment-reasoning/trust-calibration", "ai-design-skills/ai-alignment-reasoning/transparency-patterns", "ai-design-skills/model-interaction-design/mixed-initiative-flow", "ai-design-skills/model-interaction-design/generative-ui", "ai-design-skills/design-agent-orchestration/failure-recovery", "ai-design-skills/ai-alignment-reasoning/escalation-design", "S14", "S17"], "version": "1.0", "updated": "2026-10-22"}, {"id": "03-ux-design/wireframe-spec", "file": "03-ux-design/skills/wireframe-spec.md", "slug": "wireframe-spec", "stage": "03-ux-design", "order": 8, "step": 3, "name": "Specify wireframes", "summary": "Turns flows into annotated, greyscale layouts that fix content priority and behaviour before any visual design.", "fires_when": "Flows and states are settled and layout must be decided; \"wireframe this\", \"lay out the screen\"; also first-run and onboarding screens.", "inputs": ["work/03-ux-spec.md (model", "ia", "flows", "states", "forms", "copy)"], "output": "work/03-ux-spec.md#wireframes", "steps": ["Choose fidelity for the question: boxes and labels for structure, mid-fidelity with real copy for review, annotated for handoff.", "Lay out each place from the breadboard. Put content in priority order and number it.", "Use real copy from `ux-writing` and real data lengths, never lorem ipsum.", "Annotate: what each element does on click, hover and focus; dynamic or personalised content; responsive behaviour; heading levels; accessibility notes (focus order, landmarks, alt text needs).", "Include each designed state (empty, loading, error) for key screens.", "Check against `references/ux-laws.md`: fewer choices at decision points, large targets for frequent actions, familiar patterns, short steps.", "For first-run screens: get users to value fast, ask only what is needed now, make tours skippable, use empty states as onboarding, and label any sample data clearly."], "draws_on": ["designer-skills/prototyping-testing/wireframe-spec", "designer-skills/interaction-design/onboarding-design"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/visual-direction", "file": "04-ui-design/skills/visual-direction.md", "slug": "visual-direction", "stage": "04-ui-design", "order": 1, "step": 4, "name": "Set the visual direction", "summary": "Chooses a deliberate visual direction from the product type, audience and brand, explores a few options, and has a person pick one, so screens do not default to the generic AI look.", "fires_when": "A new product, page or redesign needs a look; \"what style should this be\", \"art direct this\", \"it looks generic\"; before any screens are composed.", "inputs": ["work/00-brief.md", "work/02-direction.md#principles", "brand files in work/inputs/", "work/05-system/ if a system exists"], "output": "work/04-ui-spec.md#direction, then DESIGN.md via context-files (05)", "steps": ["Read the brief for style signals: product type (SaaS, e-commerce, dashboard, content, tool), audience and context of use, brand values, and words the stakeholders used (\"calm\", \"expert\", \"playful\").", "Shortlist styles that fit the product. Use `references/ui-data/` (products, styles, colours, typography and reasoning rules) to see which styles suit this product type and which to avoid. Check each style's notes on accessibility, dark mode and performance.", "Gather references. A few sites or brands the team admires, and DESIGN.md files of similar brands from getdesign.md as study material (S05). Record what to take from each: a principle, never a copy.", "Set the dials: how bold or restrained (variance), how much motion, and how dense (spacious marketing page versus dense dashboard).", "Produce two or three directions at the same fidelity: palette, type pairing, spacing density, shape language (radius, borders, shadows), iconography and one key screen rendered in each.", "List anti-patterns to avoid for this product, for example purple gradients by default, emoji as icons, gratuitous glass effects, one radius and shadow on everything, centring everything.", "A person picks one direction (gate G4). Record why with `decision-log`.", "Hand the chosen direction to `design-tokens` and `context-files` (05) so it becomes the source of truth."], "draws_on": ["ui-ux-pro-max-skill/uupm/ui-ux-pro-max", "ui-ux-pro-max-skill/uupm/design", "S24", "S12", "S05"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/layout-and-spacing", "file": "04-ui-design/skills/layout-and-spacing.md", "slug": "layout-and-spacing", "stage": "04-ui-design", "order": 2, "step": 4, "name": "Set layout, grid and spacing", "summary": "Defines a grid, a spacing scale and responsive rules that keep every screen consistent and readable on every device.", "fires_when": "Defining page structure, grids, breakpoints or spacing; \"it feels cramped\", \"make it responsive\", \"what grid should we use\".", "inputs": ["work/04-ui-spec.md#direction", "work/03-ux-spec.md#wireframes"], "output": "work/04-ui-spec.md#layout, spacing tokens via design-tokens (05)", "steps": ["Pick a base unit of 4 or 8 pixels and build a spacing scale from it, for example 4, 8, 12, 16, 24, 32, 48, 64. Choose density: spacious for marketing and reading, compact for data-heavy tools.", "Apply spacing by relationship: less space inside a group than between groups. Related items sit close; separate sections get clear gaps.", "Define the grid: 4 columns on phones, 8 on tablets, 12 on desktops; gutters of 16, 24 or 32; outer margins of 16 on phones and 24 to 48 on desktops.", "Set breakpoints from content, starting from common ranges: phones up to about 639, tablets to 1023, laptops to 1439, large screens above. Design mobile first.", "Keep text readable: 45 to 75 characters per line for body text, 55 to 70 for long reading. Cap text containers (about 65ch) instead of stretching to full width.", "Adapt to input: touch targets at least 44 by 44 points (48 by 48 on Android) with 8 pixels between them; hover is never the only way to reveal something.", "Follow platform conventions for iOS, Android and web where users expect them: navigation placement, back behaviour, safe areas.", "Avoid sideways scrolling of the page; let wide tables scroll inside their own container."], "draws_on": ["designer-skills/ui-design/layout-grid", "designer-skills/ui-design/spacing-system", "designer-skills/ui-design/responsive-design", "designer-skills/ui-design/readable-measure", "designer-skills/ui-design/platform-conventions"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/typography", "file": "04-ui-design/skills/typography.md", "slug": "typography", "stage": "04-ui-design", "order": 3, "step": 4, "name": "Set typography", "summary": "Sets a small type scale, weights and spacing that create clear hierarchy, read well and scale with users' text-size settings.", "fires_when": "Choosing typefaces, sizes or text styles; \"the text hierarchy is off\", \"set up the type scale\".", "inputs": ["work/04-ui-spec.md#direction"], "output": "work/04-ui-spec.md#type, type tokens via design-tokens (05)", "steps": ["Choose typefaces to suit the direction: usually one family for interface text, optionally a display face for headings. Check language and character support, weights available, licence and loading cost. `references/ui-data/typography.csv` lists tested pairings.", "Build a scale from a ratio (1.2 to 1.333) with four to six sizes, for example 14, 16, 20, 24, 32, 40. Body text is 16 pixels (1rem) or more; small text no less than 14 (0.875rem).", "Set line height: 1.5 or more for body text, 1.2 to 1.3 for headings, up to 1.75 for long reading. Paragraph spacing at least 1.5 times the font size.", "Limit weights to two or three (for example 400, 600, 700). Use size and weight together for hierarchy; a step of about 1.5 times in size reads as a clear level.", "Letter spacing: slightly tighter for large headings, normal for body, slightly wider for small uppercase labels.", "Use relative units so text grows with browser and system settings. Check the layout at 200 per cent text size and with the largest system text.", "Map styles to roles: display, heading 1 to 3, body, small, label, caption, code. Name them by role, not by size."], "draws_on": ["designer-skills/ui-design/typography-scale", "inclusive-design-skills/adaptive-interfaces/flexible-typography"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/colour", "file": "04-ui-design/skills/colour.md", "slug": "colour", "stage": "04-ui-design", "order": 4, "step": 4, "name": "Build the colour system", "summary": "Creates a layered colour system (brand, neutrals, meaning) with accessible contrast in light and dark themes, never relying on colour alone.", "fires_when": "Choosing a palette, adding dark mode, or fixing contrast; \"pick colours\", \"it fails contrast\", \"add a dark theme\".", "inputs": ["work/04-ui-spec.md#direction", "brand colours"], "output": "work/04-ui-spec.md#colour, colour tokens via design-tokens (05)", "steps": ["Brand palette: primary, secondary and accent, each with a tonal scale (for example 50 to 950).", "Neutrals: a grey scale for text, surfaces and borders. Tint it slightly toward the brand hue so it looks intentional.", "Semantic colours for success, warning, error and information, each with a background, border and text value. Keep these separate from the brand accent.", "Map to roles, not raw values: text-primary, text-secondary, surface, surface-raised, border, action, action-hover, focus, and so on. Components use roles only.", "Check contrast: body text 4.5:1 (7:1 for enhanced), large text 3:1, interface parts and focus rings 3:1 against what is next to them. Check every pairing in both themes.", "Design dark mode properly: layered dark surfaces (raised surfaces get lighter), off-white text instead of pure white, accents desaturated by about 10 to 20 per cent, and contrast re-checked. Never invert the light theme.", "Never use colour alone to carry meaning. Pair it with text, icons, patterns or position. About 1 in 12 men has a colour vision deficiency. Test with a simulator.", "For charts, hand a distinct, accessible series palette to `data-visualisation`."], "draws_on": ["designer-skills/ui-design/color-system", "designer-skills/ui-design/dark-mode-design", "inclusive-design-skills/adaptive-interfaces/colour-independence"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/visual-hierarchy", "file": "04-ui-design/skills/visual-hierarchy.md", "slug": "visual-hierarchy", "stage": "04-ui-design", "order": 5, "step": 6, "name": "Compose visual hierarchy", "summary": "Arranges size, weight, colour, space and position so people see the right thing first and can scan the rest.", "fires_when": "Laying out a screen so the important thing is seen first; \"nothing stands out\", \"everything shouts\", \"what should people notice first\".", "inputs": ["work/03-ux-spec.md#wireframes (priority numbers)", "type", "colour and spacing from this stage"], "output": "work/04-ui-spec.md#hierarchy", "steps": ["Rank the content using the wireframe priority numbers: primary (page title, main action), secondary (section headings, key content), tertiary (supporting text, metadata) and quaternary (fine print).", "Give each level a distinct treatment using a few tools at once: size (about 1.5 times between levels), weight, contrast, space and position. Top-left and top-centre are seen first in left-to-right languages.", "One primary action per view. Make it the most prominent control; secondary actions step down clearly.", "Use isolation sparingly. One element that differs is noticed; several compete. Keep emphasis for what truly matters.", "Group with space and shared containers so related items read as one unit (see `references/perception.md`).", "Squint test: blur the screen. The primary content and action should still stand out.", "Remember that a polished look makes people more forgiving of usability problems; do not let it hide them in testing."], "draws_on": ["designer-skills/ui-design/visual-hierarchy", "designer-skills/ui-design/von-restorff-effect", "designer-skills/ui-design/aesthetic-usability"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/motion", "file": "04-ui-design/skills/motion.md", "slug": "motion", "stage": "04-ui-design", "order": 6, "step": 4, "name": "Design motion", "summary": "Uses motion to explain change (where something came from, what happened) with a small set of shared timings, and makes it safe for people sensitive to movement.", "fires_when": "Adding transitions, micro-interactions or animation; \"make it feel alive\", \"spec the animation\"; defining motion tokens.", "inputs": ["work/03-ux-spec.md#states", "work/04-ui-spec.md#direction"], "output": "work/04-ui-spec.md#motion, motion tokens via design-tokens (05)", "steps": ["Give motion a job: show cause and effect, keep continuity between states, draw attention once, or give feedback. If it does none of these, remove it.", "Define duration tokens, four to six at most: about 50 to 100 ms for state changes, 150 to 250 for small transitions, 250 to 400 for panels and modals, up to 600 for rare emphasis.", "Define easing tokens: standard for moving between states, decelerate for entering, accelerate for leaving, and an optional spring for playful touches.", "Choreograph: stagger related items by 30 to 50 ms, lead with the most important, and keep a whole sequence under about 500 ms.", "Spec micro-interactions: trigger, rules, feedback, and what happens on repeat or interruption.", "Respect reduced motion: when the setting is on, replace movement with instant changes or fades. No autoplaying motion without a pause control. Nothing flashes more than three times a second. Avoid parallax and large zooms.", "Animate opacity and transform, not size and layout, to avoid jank."], "draws_on": ["designer-skills/interaction-design/animation-principles", "designer-skills/interaction-design/micro-interaction-spec", "designer-skills/design-systems/motion-system", "inclusive-design-skills/inclusive-interaction/motion-sensitivity"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/data-visualisation", "file": "04-ui-design/skills/data-visualisation.md", "slug": "data-visualisation", "stage": "04-ui-design", "order": 7, "step": 6, "name": "Design data visualisation", "summary": "Picks the right chart for the question, encodes data honestly, and makes charts readable for everyone.", "fires_when": "The product shows charts, dashboards or metrics; \"which chart should we use\", \"design the dashboard\".", "inputs": ["the data and the questions people ask of it", "colour roles from this stage"], "output": "work/04-ui-spec.md#charts", "steps": ["Start from the question the viewer asks: comparison, change over time, part of a whole, distribution or relationship.", "Choose the chart: bars for comparing categories, lines for trends over time, stacked bars or a single bar for parts of a whole (pie only with two or three parts), histograms or box plots for distributions, scatter for relationships. A single number with context (previous value, target) often beats a chart.", "Encode honestly: bars start at zero, axes are labelled, scales stay consistent across small multiples, no 3D or decorative effects.", "Reduce clutter: light grid lines, direct labels instead of legends where possible, highlight the series that matters and grey the rest.", "Use accessible colour: a distinct series palette that also differs in lightness, never more than about six series, and never colour alone; add labels, patterns or shapes.", "Make it accessible: a text summary of the main point, data available as a table, keyboard-reachable tooltips.", "Plan responsive behaviour: simplify or switch chart type on small screens rather than shrinking.", "Put the summary before the detail on dashboards: key numbers and their state first, then charts, then tables."], "draws_on": ["designer-skills/ui-design/data-visualization"], "version": "1.0", "updated": "2026-10-22"}, {"id": "04-ui-design/compose-screen", "file": "04-ui-design/skills/compose-screen.md", "slug": "compose-screen", "stage": "04-ui-design", "order": 8, "step": 6, "name": "Compose a screen", "summary": "Assembles a high-fidelity screen from the agreed wireframe, copy, states and design system, then runs a pre-delivery check before anyone reviews it.", "fires_when": "Building a high-fidelity screen or page from the spec and the system; \"design this screen\", \"build the page\".", "inputs": ["work/03-ux-spec.md (wireframes", "states", "copy)", "work/04-ui-spec.md", "work/05-system/ (DESIGN.md", "tokens", "components)"], "output": "screens or coded pages, listed in work/04-ui-spec.md#screens", "steps": ["Load the sources of truth: DESIGN.md, tokens, the component library and any page-specific overrides. If a page override exists, it wins over the master file.", "Build from existing components. If a needed component does not exist, stop and spec it with `component-spec` (05) rather than inventing one inline.", "Apply the wireframe priorities with `visual-hierarchy`, real copy, and real data lengths.", "Build every state listed for the screen: empty, loading, error, success.", "Use tokens only for colour, type, spacing, radius, shadow and motion.", "Run the pre-delivery check:", "Hand the screen to critique (06)."], "draws_on": ["ui-ux-pro-max-skill/uupm/ui-styling", "S24", "S01"], "version": "1.0", "updated": "2026-10-22"}, {"id": "05-ai-design-systems/audit-system", "file": "05-ai-design-systems/skills/audit-system.md", "slug": "audit-system", "stage": "05-ai-design-systems", "order": 1, "step": 5, "name": "Audit the design system", "summary": "Measures how solid an existing design system is and what must be fixed before AI can build from it reliably. AI compliance only works on a system that is already sound (S10).", "fires_when": "Before binding AI to an existing system; \"is our design system AI-ready\", \"audit our tokens\", \"the build has drifted\"; inheriting a product.", "inputs": ["the design files", "component library and code", "work/00-brief.md"], "output": "work/05-system/audit.md", "steps": ["Set scope: whole product, one area or one platform. Capture every screen and state in scope.", "Check AI-readiness against four tests (S40):", "Audit tokens: extract every visual value from files and code, match to tokens, and report the share using tokens, hard-coded values, duplicates with different names, deprecated tokens still in use, and gaps.", "Audit components: in use but not in the system, built differently per platform without reason, detached instances in design files, specs that do not match the build.", "Audit debt by type: visual inconsistency, structural (patterns that no longer scale), accessibility (known WCAG failures, components that fail with assistive technology), documentation (decisions only in people's heads).", "Prioritise by how often an issue appears times its impact on users. Accessibility failures go first.", "Recommend a plan: fix now, fix before AI use, and track. State whether the system is ready for AI to build from, ready with named limits, or not ready."], "draws_on": ["designer-skills/design-ops/design-debt-audit", "designer-skills/designer-toolkit/design-token-audit", "S10", "S40"], "version": "1.0", "updated": "2026-10-22"}, {"id": "05-ai-design-systems/design-tokens", "file": "05-ai-design-systems/skills/design-tokens.md", "slug": "design-tokens", "stage": "05-ai-design-systems", "order": 2, "step": 5, "name": "Define design tokens", "summary": "Turns visual decisions into named tokens in three tiers, so every screen, theme and AI output draws from the same values.", "fires_when": "Creating or extending tokens for colour, type, spacing, radius, elevation or motion; adding themes or dark mode; \"set up our tokens\".", "inputs": ["work/04-ui-spec.md (direction", "layout", "type", "colour", "motion) or the audit"], "output": "work/05-system/tokens.json and the tokens section of DESIGN.md", "steps": ["Global tokens hold raw values: the colour scales, the spacing scale, type sizes, radii, shadows, durations and easings.", "Semantic (alias) tokens describe purpose and point to globals: `color-text-primary`, `color-surface-raised`, `color-action-primary`, `space-stack-md`. Themes override this tier only.", "Component tokens are optional and scoped: `button-color-background-primary`. Use them only where a component needs to diverge.", "Name consistently: `{category}-{property}-{concept}-{variant}-{state}`, lower case with hyphens, named by purpose not appearance (\"danger\", not \"red\").", "Theme by overriding semantic tokens: light, dark, high contrast, and density modes. Record which tokens are themeable and which are fixed.", "Document each token with its use and a do-not-use note where people tend to misuse it.", "Export in a neutral format (for example the W3C design tokens JSON) and generate platform outputs (CSS variables, design-tool variables) from it.", "Version tokens with the system and note changes."], "draws_on": ["designer-skills/design-systems/design-token", "designer-skills/design-systems/naming-convention", "designer-skills/design-systems/theming-system"], "version": "1.0", "updated": "2026-10-22"}, {"id": "05-ai-design-systems/component-spec", "file": "05-ai-design-systems/skills/component-spec.md", "slug": "component-spec", "stage": "05-ai-design-systems", "order": 3, "step": 5, "name": "Specify a component", "summary": "Writes a complete, implementable component spec once, so design files and code are generated from the same definition.", "fires_when": "A new or changed component is needed; \"spec this component\", \"we need a date picker\"; a screen needs something the library lacks.", "inputs": ["work/03-ux-spec.md#states", "tokens", "existing library"], "output": "work/05-system/components/<name>.md", "steps": ["Check the library first: connected library, then local components, then build new only if nothing fits. Never rebuild basic parts the system already has (buttons, inputs, checkboxes, toggles, badges, avatars, icons, tabs, alerts, toasts, spinners).", "Research before drawing: look at how mature libraries handle the same component (anatomy, variants, naming) and at accessible patterns (ARIA roles, keyboard behaviour, focus). Record what you took and why (S09).", "Write the spec:", "Bind every visual value to a token. If one is missing, flag the gap and decide: use the nearest token or add one through `design-tokens`.", "Specify the layout model (auto layout or flex) so it resizes predictably."], "draws_on": ["designer-skills/design-systems/component-spec", "claude2figma/claude2figma/component-rules", "S09"], "version": "1.0", "updated": "2026-10-22"}, {"id": "05-ai-design-systems/context-files", "file": "05-ai-design-systems/skills/context-files.md", "slug": "context-files", "stage": "05-ai-design-systems", "order": 4, "step": 5, "name": "Write the AI context files", "summary": "Writes two plain-text files that carry the visual system and the UX knowledge to any AI tool: DESIGN.md for how it looks, UX.md for how it should work and why.", "fires_when": "Preparing a project so any AI can design or build consistently; \"write our DESIGN.md\", \"make the system AI-readable\"; after tokens and the visual direction are set.", "inputs": ["tokens.json", "component specs", "work/04-ui-spec.md#direction", "work/01-research.md", "work/03-ux-spec.md#model"], "output": "work/05-system/DESIGN.md, work/05-system/UX.md", "steps": ["DESIGN.md (following the open DESIGN.md format, S05):", "UX.md (S13):", "Add a decision log section or link `decisions.md`, so future sessions inherit choices (S07).", "Keep them short and ordered: hard rules first. Remove anything an AI would not act on.", "Test: give an AI only these files and a small task, then check the result against the system with `slop-check` and `critique-screen`. Fix what it got wrong by improving the files."], "draws_on": ["ui-ux-pro-max-skill/uupm/design-system"
