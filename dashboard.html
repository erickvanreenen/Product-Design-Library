, "S05", "S07", "S12", "S13", "S40"], "version": "1.0", "updated": "2026-10-22"}, {"id": "05-ai-design-systems/design-tool-sync", "file": "05-ai-design-systems/skills/design-tool-sync.md", "slug": "design-tool-sync", "stage": "05-ai-design-systems", "order": 5, "step": 5, "name": "Sync with the design tool", "summary": "Makes AI-driven work in a design tool use the real library and tokens, never raw values, and keeps design and code in step. Written around Figma, the method applies to any tool with a library and variables.", "fires_when": "An AI writes to or reads from a design tool (for example Figma) or syncs design and code; \"build this in Figma\", \"push the system to Figma\", \"keep design and code in step\".", "inputs": ["work/05-system/ (tokens", "components", "DESIGN.md)", "the design file link"], "output": "design file updates and a compliance report in work/05-system/sync-log.md", "steps": ["Preflight before any work: confirm the tool connection, that the file can be opened, which libraries are connected, and inventory the styles, variables and components available. Stop if any check fails.", "Interpret references against the system: when given a screenshot or link, describe its layout, type, colour, spacing, focal point and components, then map each observation to an existing token or component. Flag every gap and wait for a decision before building.", "Library first: use library components, then local components, and build from scratch only if nothing matches. Never rebuild primitives the system provides.", "Bind every value: text uses text styles; fills, strokes, spacing, radius and effects bind to variables or styles. Raw values are not allowed. If no match exists, report the gap and wait.", "Use layout rules (auto layout or equivalent) so frames resize correctly.", "Verify after each write: scan the created nodes for unbound values or detached instances and fix them.", "Sync both ways only when the system is solid: pull the system into code and build against real components, then push built work back to the canvas for editing. A half-finished system makes the AI invent the missing half (S29)."], "draws_on": ["claude2figma/claude2figma/figma-preflight", "claude2figma/claude2figma/figma-style-binding", "claude2figma/claude2figma/reference-interpreter", "S27", "S29"], "version": "1.0", "updated": "2026-10-22"}, {"id": "05-ai-design-systems/system-governance", "file": "05-ai-design-systems/skills/system-governance.md", "slug": "system-governance", "stage": "05-ai-design-systems", "order": 6, "step": 5, "name": "Govern the design system", "summary": "Sets how the system changes over time (who owns it, how changes are proposed, versioned and retired), so it grows without splitting into variants.", "fires_when": "The system is used by more than one person or team; \"who decides what goes in the system\", \"how do we deprecate this\"; setting up contribution rules.", "inputs": ["work/05-system/", "team structure"], "output": "work/05-system/governance.md", "steps": ["Choose an ownership model: a central team owns everything (consistent, can bottleneck), anyone contributes through review (fast, needs strong standards), or a hybrid where a core team owns foundations and product teams own domain components.", "Define contribution: how to propose (a short request with the problem, evidence and proposed spec), who reviews, the quality bar (spec complete, accessible, tokens only, documented), and how decisions are logged.", "Version and communicate: semantic versions, a changelog, and notice for breaking changes with migration help.", "Deprecate deliberately: mark it, give a replacement and a timeline, then remove.", "Document patterns, not just components: recurring solutions (search with filters, empty states, bulk actions) with when to use them and examples.", "Use one documentation template per component and pattern so people and AI find the same sections in the same place.", "Review regularly: adoption, drift (from `design-qa`, 07), open gaps and requests."], "draws_on": ["designer-skills/design-systems/design-system-governance", "designer-skills/design-systems/documentation-template", "designer-skills/design-systems/pattern-library"], "version": "1.0", "updated": "2026-10-22"}, {"id": "06-design-critique/critique-screen", "file": "06-design-critique/skills/critique-screen.md", "slug": "critique-screen", "stage": "06-design-critique", "order": 1, "step": 7, "name": "Critique a screen", "summary": "Reviews one screen against seven craft lenses and returns a prioritised fix list, each point with an observation, the problem and a specific fix.", "fires_when": "A screen, mockup or screenshot needs review; \"what is wrong with this screen\", \"review this design\", \"why does this feel off\"; after compose-screen.", "inputs": ["the screen", "work/03-ux-spec.md (priorities", "copy)", "work/05-system/DESIGN.md", "work/02-direction.md#principles"], "output": "work/06-critique.md#screens", "steps": ["State the screen's purpose and its primary user goal before judging.", "Run each lens. For each finding write: observation (neutral), problem (and why it matters to users), fix (specific and actionable).", "Rate each lens pass, minor issue or major issue.", "Check principles: does the screen honour the ranked design principles?", "Prioritise: major issues that block the user goal first, then accessibility, then polish. Limit the list to what can be fixed in the next round."], "draws_on": ["designer-skills/visual-critique/critique-visual-hierarchy", "designer-skills/visual-critique/critique-typography", "designer-skills/visual-critique/critique-color", "designer-skills/visual-critique/critique-composition", "designer-skills/visual-critique/critique-information-density", "designer-skills/visual-critique/critique-affordance", "designer-skills/visual-critique/critique-brand-consistency"], "version": "1.0", "updated": "2026-10-22"}, {"id": "06-design-critique/heuristic-review", "file": "06-design-critique/skills/heuristic-review.md", "slug": "heuristic-review", "stage": "06-design-critique", "order": 2, "step": 7, "name": "Run a heuristic review", "summary": "Walks through the product against recognised usability heuristics, adapted for AI features where present, and rates each problem by severity.", "fires_when": "Reviewing a flow or product for usability before testing; \"do a heuristic evaluation\", \"expert review\"; reviewing an AI feature.", "inputs": ["the flows or prototype", "work/03-ux-spec.md", "work/03-ux-spec.md#ai-behaviour if relevant"], "output": "work/06-critique.md#heuristics", "steps": ["Set scope: which flows and tasks.", "Walk each task twice: as a new user, then as an experienced one.", "Check the ten heuristics:", "System status is visible (for AI: what it is doing, using and how sure it is).", "It speaks the user's language (no model internals or jargon).", "Users can undo, exit and stop (including stopping generation and overriding AI).", "Consistency with conventions and with itself (AI gives a consistent format for similar requests).", "Errors are prevented (AI asks to clarify before producing weak output).", "Recognition over recall (show what is possible, including what the AI can do).", "Flexibility for novices and experts.", "Minimal design (no irrelevant content; AI output without padding or needless caveats).", "Errors are explained in plain terms with a way to recover.", "Help is available in context.", "For AI features, also check: trust is calibrated, failure is partial rather than total, users can correct it and see it adapt, limits are clear before users hit them, and the AI takes the right amount of initiative.", "Record each issue: heuristic, location, description, severity, recommendation.", "Rate severity 0 to 4: not a problem, cosmetic, minor, major, catastrophic (fix before release).", "Where possible use two or three reviewers and merge findings; one reviewer misses many issues."], "draws_on": ["designer-skills/prototyping-testing/heuristic-evaluation", "ai-design-skills/evaluation/heuristic-evaluation-ai"], "version": "1.0", "updated": "2026-10-22"}, {"id": "06-design-critique/coherence-check", "file": "06-design-critique/skills/coherence-check.md", "slug": "coherence-check", "stage": "06-design-critique", "order": 3, "step": 7, "name": "Check coherence with the layers below", "summary": "Checks that what users see matches what was decided underneath (the model, vocabulary, flows and needs), and separates true surface fixes from problems that need a lower layer revisited.", "fires_when": "After screens exist; \"the UI is fine but something is off\", \"are we consistent\"; before handoff; when surface fixes keep coming back.", "inputs": ["screens", "work/03-ux-spec.md (model", "vocabulary", "flows)", "work/01-research.md#needs"], "output": "work/06-critique.md#coherence", "steps": ["Vocabulary check: compare every label, heading, button, error, notification and help text with the vocabulary list. Flag wrong terms, terms not in the list, and mixed terms for one thing.", "Object check: for each object in the model, where does it appear and in how many forms? Flag objects that change shape between contexts, and forms where users cannot tell what kind of thing they are looking at.", "Completeness both ways: every action in the flows exists on screen, and nothing on screen lacks a model or flow behind it.", "Error check: every error state diagnoses, explains and offers recovery.", "Prominence check: what the flow needs users to notice is what stands out.", "Emotional register: tone and emphasis fit the emotional and social jobs from research, not the product's own self-promotion.", "Accessibility is decided: focus order, names and announcements were specified rather than left to defaults.", "Route each finding: surface fix (copy, layout, style) or deeper issue. Deeper issues go back to `conceptual-model`, `user-flows` or `needs-and-jobs`, logged with `decision-log`."], "draws_on": ["layers-skills/layers/layers-surface"], "version": "1.0", "updated": "2026-10-22"}, {"id": "06-design-critique/slop-check", "file": "06-design-critique/skills/slop-check.md", "slug": "slop-check", "stage": "06-design-critique", "order": 4, "step": 7, "name": "Check for AI slop", "summary": "Finds and removes the tells that make writing and interfaces read as machine-made and generic, so the work sounds and looks like this product.", "fires_when": "Any AI-written copy or AI-generated UI is about to ship or be reviewed; \"this sounds like AI\", \"this looks generic\", \"clean up this copy\".", "inputs": ["copy or screens produced with AI", "work/05-system/DESIGN.md", "voice and tone in UX.md"], "output": "work/06-critique.md#slop, with corrected copy", "steps": ["Filler: throat-clearing openers (\"Here's the thing\"), emphasis crutches, stock phrases, adverbs that add nothing.", "Formulaic structures: \"not X, it is Y\" contrasts, staged run-ups before the point, one-line dramatic closers, sayings that sound deep, arguing with nobody.", "Rhythm by rule: forced groups of three, repeated sentence openings, dashes as the default joiner, stacked qualifiers, every sentence the same length.", "Inflation: overused AI words, inflated significance, vague associations, sales language, borrowed authority.", "Voice: passive voice with no actor, inanimate things doing human actions, narrator-from-a-distance instead of \"you\".", "Formatting by rule: bold used as decoration, headings that repeat the first sentence, chatbot leftovers (\"I hope this helps\").", "Fix by stating the point directly, naming the specific thing, using active voice and varying rhythm. Check against the product's voice; do not strip a deliberate voice.", "Default AI looks: purple-to-blue gradients, emoji used as icons, glass effects everywhere, the same radius and shadow on every block, everything centred, one accent colour on near-black, a generic serif-on-cream editorial look when nobody chose it.", "Off-system values: colours, sizes or spacing not in DESIGN.md.", "Mixed icon styles, placeholder imagery left in, lorem ipsum.", "Visual confidence on uncertain content: bold headers and decisive layout around guesses."], "draws_on": ["stop-slop/writing/stop-slop", "humanizer/writing/humanizer", "ui-ux-pro-max-skill/uupm/ui-ux-pro-max", "S23"], "version": "1.0", "updated": "2026-10-22"}, {"id": "06-design-critique/critique-session", "file": "06-design-critique/skills/critique-session.md", "slug": "critique-session", "stage": "06-design-critique", "order": 5, "step": 7, "name": "Run a critique session", "summary": "Runs a structured critique with people that produces clear, actionable decisions instead of opinions.", "fires_when": "Work needs feedback from people (team, stakeholders, cross-team); \"set up a crit\", \"how do we review this together\".", "inputs": ["the work", "its goals and stage", "findings from the other critique skills"], "output": "work/06-critique.md#session", "steps": ["Before: the designer shares goals, constraints, audience, stage of work and exactly what feedback is wanted. Share AI critique findings in advance so the session focuses on judgement.", "Present (about 5 minutes): the work and the problem it solves.", "Clarify (about 5 minutes): questions to understand, not to judge.", "Feedback rounds by area or priority, using four forms: \"I notice...\" (observation), \"I wonder...\" (question), \"What if...\" (alternative), \"I think... because...\" (opinion with a reason tied to users, principles or evidence).", "Discuss the main tensions.", "Capture decisions and actions with owners and dates. The designer summarises at the end.", "For each point, record accepted or rejected with a reason (gate G7)."], "draws_on": ["designer-skills/design-ops/design-critique"], "version": "1.0", "updated": "2026-10-22"}, {"id": "07-qa-accessibility/accessibility-audit", "file": "07-qa-accessibility/skills/accessibility-audit.md", "slug": "accessibility-audit", "stage": "07-qa-accessibility", "order": 1, "step": 8, "name": "Audit accessibility", "summary": "Checks a design or build against WCAG 2.2 AA and the practical needs behind it, with each issue rated by how badly it blocks people.", "fires_when": "A design or build needs an accessibility check; \"is this accessible\", \"run a WCAG audit\", \"check contrast and keyboard\"; before release.", "inputs": ["screens", "prototype or build", "component specs"], "output": "work/07-qa-report.md#accessibility", "steps": ["Automated pass on every page and state (for example axe, Lighthouse, WAVE). This catches roughly a third of issues; it is the start, not the audit.", "Perceivable: text alternatives for meaningful images (empty for decorative ones), captions and transcripts, contrast (4.5:1 text, 3:1 large text and interface parts), nothing by colour alone, content reflows at 400 per cent zoom and text resizes to 200 per cent, headings form a logical outline.", "Operable: everything works by keyboard in visual order; focus is always visible (at least a 2 pixel outline at 3:1); focus moves into dialogs and returns afterwards; no keyboard traps; skip links and landmarks; targets at least 24 by 24 pixels on desktop and 44 by 44 on touch, with spacing; no timing without a way to extend; no flashing more than three times a second; gestures have simple alternatives.", "Understandable: plain language, predictable behaviour, labels and instructions for inputs, errors identified and explained.", "Robust: semantic markup, correct names, roles and states for custom components, status messages announced.", "Manual checks with assistive technology: a screen reader (VoiceOver, NVDA or TalkBack), voice control, magnification, high contrast and reduced motion.", "Rate each issue: critical (blocks access), major (serious difficulty), minor (workaround exists), enhancement. Record the WCAG criterion, location, who is affected and the fix."], "draws_on": ["designer-skills/design-systems/accessibility-audit", "inclusive-design-skills/inclusive-interaction/keyboard-navigation", "inclusive-design-skills/inclusive-interaction/touch-target-design", "inclusive-design-skills/accessible-content/heading-structure", "inclusive-design-skills/accessible-content/alt-text-design"], "version": "1.0", "updated": "2026-10-22"}, {"id": "07-qa-accessibility/cognitive-load-check", "file": "07-qa-accessibility/skills/cognitive-load-check.md", "slug": "cognitive-load-check", "stage": "07-qa-accessibility", "order": 2, "step": 8, "name": "Check cognitive load", "summary": "Walks a flow as a tired, stressed, unfamiliar user and measures the decisions, memory and new ideas it demands, then removes the load that is not essential.", "fires_when": "Flows feel heavy or people drop out; \"is this too complicated\", \"simplify this flow\"; before release of any multi-step task.", "inputs": ["flows", "screens", "copy"], "output": "work/07-qa-report.md#cognitive-load", "steps": ["Walk the flow as someone tired, distracted and new to the product.", "At each screen, count decisions, things to remember, new concepts, steps, reading difficulty and visual clutter. Rate each low, medium or high:", "Mark the spikes: where you pause, re-read or feel unsure.", "Separate essential load (the task is genuinely complex) from added load (caused by the design).", "Reduce added load: show only what this step needs, use smart defaults, group into sets of three to five, show options instead of asking people to recall, keep earlier choices visible, one primary action per screen, plain language.", "Support attention: no needless interruptions, distractions or autoplay; let people pause and resume without losing work."], "draws_on": ["inclusive-design-skills/cognitive-accessibility/cognitive-load-assessment", "inclusive-design-skills/cognitive-accessibility/memory-load-reduction", "inclusive-design-skills/cognitive-accessibility/focus-attention-design"], "version": "1.0", "updated": "2026-10-22"}, {"id": "07-qa-accessibility/compliance-check", "file": "07-qa-accessibility/skills/compliance-check.md", "slug": "compliance-check", "stage": "07-qa-accessibility", "order": 3, "step": 8, "name": "Check legal accessibility requirements", "summary": "Works out which accessibility rules apply to this product, based on where its users are, who they are and what it does, and maps design decisions to the criteria behind them. This is guidance for design decisions, not legal advice.", "fires_when": "Planning or releasing a product; \"which accessibility laws apply\", \"do we need to meet WCAG\"; entering a new market.", "inputs": ["work/00-brief.md (markets", "audience", "sector)"], "output": "work/07-qa-report.md#compliance", "steps": ["List the facts: countries and regions served, sector (public, banking, transport, e-commerce, health), product type (website, app, kiosk, document), organisation size, and whether it sells to the public or to businesses.", "Identify likely frameworks and confirm each with the legal owner. Common ones: WCAG 2.2 AA as the usual technical baseline; the European Accessibility Act, in force since 28 June 2025, with EN 301 549 as its standard; the ADA and Section 508 in the United States; the Equality Act and public sector accessibility regulations in the UK. For other regions, including South Africa, check current local law and procurement rules; do not assume.", "Map design decisions to criteria, for example: contrast to 1.4.3 and 1.4.11, colour not the only signal to 1.4.1, resize and reflow to 1.4.4 and 1.4.10, keyboard to 2.1.1, focus visible to 2.4.7, target size to 2.5.8, labels to 3.3.2, error identification to 3.3.1, name, role and value to 4.1.2.", "Note obligations beyond the interface: an accessibility statement, a feedback route, accessible documents and support channels.", "Record gaps and decisions with `decision-log`."], "draws_on": ["inclusive-design-skills/accessibility-decisions/compliance-mapping", "S26"], "version": "1.0", "updated": "2026-10-22"}, {"id": "07-qa-accessibility/usability-test-plan", "file": "07-qa-accessibility/skills/usability-test-plan.md", "slug": "usability-test-plan", "stage": "07-qa-accessibility", "order": 4, "step": 8, "name": "Plan a usability test", "summary": "Designs a usability study (objectives, participants, tasks and measures), including sessions with disabled people using their own set-ups.", "fires_when": "A prototype or build needs testing with users; \"plan a usability test\", \"write test tasks\", \"test with assistive technology users\".", "inputs": ["prototype or build", "work/03-ux-spec.md#flows", "work/01-research.md#personas", "success metrics"], "output": "work/07-qa-report.md#usability-plan", "steps": ["Objectives: the specific questions the test must answer, tied to risky assumptions and the success metrics.", "Method: moderated or unmoderated, remote or in person, and the fidelity of what is tested. Five participants per distinct user group usually reveal the main problems; more for measurement.", "Participants: screening criteria, including people with relevant disabilities using their own devices and assistive technology, and people in realistic conditions.", "Write task scenarios: give motivation, not instructions; use the participant's words, not product terms; one goal per task; never reveal the path. Mix exploratory, specific and open-ended tasks, ordered from easier to harder.", "Define measures per task: completed or not, time, errors and wrong paths, help needed, and a difficulty rating (1 to 5). Add a standard questionnaire such as SUS if comparing over time.", "Write the session guide: introduction and consent, warm-up, tasks with neutral probes, debrief.", "Pilot the plan with one person and fix confusing tasks.", "Plan analysis: how issues will be logged, rated and fed into fixes."], "draws_on": ["designer-skills/design-research/usability-test-plan", "designer-skills/prototyping-testing/test-scenario", "designer-skills/prototyping-testing/accessibility-test-plan"], "version": "1.0", "updated": "2026-10-22"}, {"id": "07-qa-accessibility/design-qa", "file": "07-qa-accessibility/skills/design-qa.md", "slug": "design-qa", "stage": "07-qa-accessibility", "order": 5, "step": 8, "name": "Check the build against the design", "summary": "Compares what was built with the spec and the system, and catches drift over time with scheduled checks.", "fires_when": "Something has been built; \"QA this build\", \"does it match the design\", \"check for drift\"; before release; on a schedule.", "inputs": ["the build or staging link", "work/04-ui-spec.md", "work/05-system/ tokens and components", "work/03-ux-spec.md#states"], "output": "work/07-qa-report.md#design-qa", "steps": ["Visual accuracy: colours, type, spacing, radius, shadows and icons match tokens; no hard-coded values.", "Layout: grid alignment, behaviour at each breakpoint, reflow, no clipping or unexpected overflow, safe areas respected.", "Interaction: every state renders (default, hover, focus, pressed, disabled, loading, error, empty); motion matches tokens and respects reduced motion; target sizes; keyboard order and visible focus.", "Content: real content fits, truncation works as specified, copy matches the copy table, no placeholder text.", "Responsive review: small phone, large phone, tablet and desktop, portrait and landscape, with the largest text size.", "Log issues with screenshot, expected versus actual, severity and owner.", "Automate drift checks where possible: a scheduled audit comparing the build against token values and contrast rules, with a clear stop condition and a report for a person to review (S25)."], "draws_on": ["designer-skills/design-ops/design-qa-checklist", "inclusive-design-skills/adaptive-interfaces/responsive-review", "S25"], "version": "1.0", "updated": "2026-10-22"}, {"id": "08-analysis/success-metrics", "file": "08-analysis/skills/success-metrics.md", "slug": "success-metrics", "stage": "08-analysis", "order": 1, "step": 2, "name": "Define success metrics", "summary": "Chooses three to five metrics that show whether the design worked, with baselines and targets, before anything is built.", "fires_when": "During ideation, before building; \"how will we know it worked\", \"what should we measure\", \"set KPIs for this feature\".", "inputs": ["work/00-brief.md success criteria", "work/02-direction.md#problem and #decision"], "output": "work/02-direction.md#metrics, then work/08-measurement.md#plan", "steps": ["Start from the outcome in the problem frame and the change in behaviour the design should cause.", "Pick metrics across the HEART dimensions that fit: happiness (satisfaction, ease ratings), engagement (frequency, depth), adoption (activation, feature uptake), retention (return rate, churn), task success (completion, time, errors).", "Balance behaviour and attitude: at least one measure of what people do and one of how they feel.", "For AI features add: completion of the user's actual task (not just a response), first-attempt success, number of turns, how often users correct or override, and abandonment.", "Write each metric fully: name, definition, how it is collected (event, survey, test), baseline, target, time frame, segment, and the hypothesis it tests.", "Add guardrail metrics that must not get worse (for example support contacts, error rate, accessibility score).", "Check the instrumentation exists. If not, specify the events needed in the handoff."], "draws_on": ["designer-skills/ux-strategy/metrics-definition", "ai-design-skills/evaluation/task-success-metrics"], "version": "1.0", "updated": "2026-10-22"}, {"id": "08-analysis/read-analytics", "file": "08-analysis/skills/read-analytics.md", "slug": "read-analytics", "stage": "08-analysis", "order": 2, "step": 9, "name": "Read the analytics", "summary": "Reads behavioural data carefully (checking the data before the conclusion) and turns its shape into hypotheses that research or experiments can test.", "fires_when": "Someone asks why people drop off or what the numbers mean; \"look at this dashboard\", \"where do users get stuck\"; after launch.", "inputs": ["analytics exports or access", "work/08-measurement.md#plan", "release and campaign dates"], "output": "work/08-measurement.md#readout", "steps": ["Check the data before trusting it:", "Read the shape:", "Form hypotheses that name the mechanism, and say how confident you are and why.", "Ask the right source. Data answers what, how often and where. Research answers why. If data and research disagree, use `synthesise-findings` (01) triangulation.", "Check the size of the effect, not only whether it is statistically significant.", "Compare results against the success metrics and targets."], "draws_on": ["designer-skills/design-research/behavioural-analytics", "designer-skills/design-research/qual-quant-triangulation", "S39"], "version": "1.0", "updated": "2026-10-22"}, {"id": "08-analysis/experiment-design", "file": "08-analysis/skills/experiment-design.md", "slug": "experiment-design", "stage": "08-analysis", "order": 3, "step": 9, "name": "Design an experiment", "summary": "Plans an A/B or multi-variant test that can actually answer its question, or says when not to run one.", "fires_when": "A change can ship to some users and traffic can decide; \"should we A/B test this\", \"design the test\".", "inputs": ["hypothesis from read-analytics or bets", "work/08-measurement.md#plan"], "output": "work/08-measurement.md#experiments", "steps": ["Write the hypothesis: \"If we [change], then [metric] will [move by how much] for [segment], because [reason].\"", "Define variants: control and one treatment that changes one thing. Add more variants only with traffic to support them.", "Choose one primary metric sensitive enough to move, plus secondary and guardrail metrics.", "Calculate sample size and duration before starting, from the baseline, the smallest effect worth detecting and the traffic. Run whole weeks to cover weekly patterns.", "Plan for known traps: no peeking or stopping early, watch for novelty effects, segment the results, and do not run overlapping tests on the same users without a plan.", "For AI features: output varies, so use larger samples; segment by task type; add side-by-side blind comparisons with structured criteria and at least three reviewers when traffic is low.", "Decide in advance what result means ship, iterate or stop."], "draws_on": ["designer-skills/prototyping-testing/a-b-test-design"], "version": "1.0", "updated": "2026-10-22"}, {"id": "08-analysis/ai-feature-evaluation", "file": "08-analysis/skills/ai-feature-evaluation.md", "slug": "ai-feature-evaluation", "stage": "08-analysis", "order": 4, "step": 9, "name": "Evaluate an AI feature", "summary": "Measures whether an AI feature helps people complete their tasks, how satisfied they are, and whether quality drifts over time.", "fires_when": "An AI feature is live or about to launch; \"is the AI getting better or worse\", \"how do we measure the assistant\", \"the model changed\".", "inputs": ["work/03-ux-spec.md#ai-behaviour", "success metrics", "usage data", "feedback"], "output": "work/08-measurement.md#ai-evaluation", "steps": ["Build a fixed test set: representative real inputs (with personal data removed) and what a good result looks like for each.", "Score quality with a rubric (accuracy, relevance, completeness, clarity, fit and safety) and weights suited to the feature. Calibrate with example outputs at each score.", "Compare versions blind: show reviewers two outputs for the same input without saying which is which, with structured criteria and at least three reviewers.", "Track task success, not just responses: completion, first-attempt success, turns, correction rate and abandonment. When quality scores and task success disagree, investigate why.", "Watch satisfaction signals: explicit (ratings, comments) and implicit. Positive: using output as-is, copying it, coming back. Negative: regenerating, heavy editing, rephrasing the same request, abandoning, switching to doing it by hand.", "Measure over time: rerun the test set on a schedule and after every model or prompt change. Alert on significant changes, diagnose the cause (model update, prompt change, new kinds of input, shifting expectations) and decide whether it is harm, noise or improvement.", "Classify failures using the categories in `ai-output-check` (00) and fix the most frequent and severe first."], "draws_on": ["ai-design-skills/evaluation/comparative-evaluation", "ai-design-skills/evaluation/user-satisfaction-signals", "ai-design-skills/evaluation/longitudinal-measurement"], "version": "1.0", "updated": "2026-10-22"}, {"id": "08-analysis/impact-report", "file": "08-analysis/skills/impact-report.md", "slug": "impact-report", "stage": "08-analysis", "order": 5, "step": 9, "name": "Report design impact", "summary": "Tells stakeholders what the design changed, with honest attribution and a clear next step.", "fires_when": "Closing a project or quarter; \"what did this design achieve\", \"report back to stakeholders\"; gate G9.", "inputs": ["work/08-measurement.md (plan", "readout", "experiments)", "work/decisions.md"], "output": "work/08-measurement.md#impact", "steps": ["Restate the outcome and targets from the plan.", "Report in three layers: user metrics (task success, errors, satisfaction), product metrics (conversion, onboarding completion, support contacts for the designed flows, accessibility score), and business metrics (revenue, churn, cost saved).", "Attribute honestly: use experiment results where they exist; where design's share cannot be isolated, say the outcome is shared and name the other factors.", "Pair numbers with evidence from people: quotes or observations that explain the change.", "Include what did not work and what was learned.", "Recommend the next iteration: what to tackle next and why (gate G9).", "Lead with impact for executives; add detail for product and engineering audiences."], "draws_on": ["designer-skills/design-ops/design-impact-reporting"], "version": "1.0", "updated": "2026-10-22"}, {"id": "09-workflow-tooling/project-setup", "file": "09-workflow-tooling/skills/project-setup.md", "slug": "project-setup", "stage": "09-workflow-tooling", "order": 1, "step": null, "name": "Set up an AI design project", "summary": "Gives the project a real structure, a single instruction file for AI and the right connections, so every session starts from the same context.", "fires_when": "Starting a project where AI will help design or build; \"set up the workspace\", \"connect the tools\", \"how should the project be structured\".", "inputs": ["work/00-brief.md", "tools available to the team"], "output": "the project folder structure and its instruction file", "steps": ["Create the structure (S46):", "Write one instruction file at the top level (AGENTS.md, CLAUDE.md or the equivalent for your tool) that points to the context pack, DESIGN.md, UX.md and this repository's AGENTS.md. Keep it short; point, do not copy.", "Keep the stack small (S29, S30): one place for thinking (chat), one for building (code editor or design tool), one for sharing (a preview link). Context builds up when tools stay put.", "Connect only what earns its place through MCP or equivalent connectors (S39): live library documentation, the component library, the design tool, the docs or PRD tool, analytics. Note each connection's purpose.", "Work on a safe branch or copy for experiments, and share real preview links for review.", "Install skills deliberately: load the stage skills from this repository the project needs, plus tool-specific ones (for example a design tool's own skills). Avoid stacking overlapping skills.", "Record the set-up in `docs/` so others and future sessions can reproduce it."], "draws_on": ["S46", "S39", "S29", "S08"], "version": "1.0", "updated": "2026-10-22"}, {"id": "09-workflow-tooling/handoff-spec", "file": "09-workflow-tooling/skills/handoff-spec.md", "slug": "handoff-spec", "stage": "09-workflow-tooling", "order": 2, "step": null, "name": "Write the handoff spec", "summary": "Packages everything engineers need to build the design as intended, referenced to the system rather than to raw values.", "fires_when": "Design is ready for engineering; \"prepare handoff\", \"write the dev spec\".", "inputs": ["work/03-ux-spec.md", "work/04-ui-spec.md", "work/05-system/", "work/07-qa-report.md"], "output": "work/handoff.md", "steps": ["Visual: token names (not hex codes or pixel values) for colour, type, spacing, radius and shadow; responsive behaviour per breakpoint.", "Interaction: every state, transitions with motion tokens, gestures, keyboard order and shortcuts, focus handling.", "Content: final copy, character limits and truncation, dynamic content rules, translation expansion and right-to-left needs, empty, loading and error content.", "Accessibility: names, roles and states for custom components, announcements, heading structure, alt text, target sizes, and accessibility decisions with their reasons.", "AI behaviour where relevant: states, confidence and source rules, escalation and fallbacks.", "Analytics: events needed to measure the success metrics.", "Assets: icons as SVG named by convention, images with formats and sizes, fonts.", "Edge cases and open questions, each with an owner.", "Walk engineers through it and agree how design QA will run."], "draws_on": ["designer-skills/design-ops/handoff-spec", "inclusive-design-skills/accessibility-decisions/handoff"], "version": "1.0", "updated": "2026-10-22"}, {"id": "09-workflow-tooling/write-rationale", "file": "09-workflow-tooling/skills/write-rationale.md", "slug": "write-rationale", "stage": "09-workflow-tooling", "order": 3, "step": null, "name": "Write the design rationale", "summary": "Turns the decision log into a clear, honest case for a design, shaped for the audience who will read or hear it.", "fires_when": "A design must be explained or defended; \"write up why we did this\", \"prepare the presentation\", \"make the case to stakeholders\".", "inputs": ["work/decisions.md", "work/01-research.md", "work/02-direction.md", "results"], "output": "work/rationale.md or a presentation", "steps": ["State the decision specifically.", "Give context: the problem, constraints and goal.", "Show the options considered and why they lost.", "Present the evidence: research, data, tests, principles. Separate evidence from craft judgement and say which is which.", "Name the trade-offs and who they affect.", "Explain how it will be validated: the metrics and the review date.", "Shape for the audience: executives get impact and the ask first; engineers get detail and edge cases; designers get process and system fit. For a presentation use hook, context, journey, solution, evidence, ask, with one idea per slide.", "Make the ask explicit: approval, feedback or resources."], "draws_on": ["designer-skills/designer-toolkit/design-rationale", "designer-skills/designer-toolkit/presentation-deck"], "version": "1.0", "updated": "2026-10-22"}, {"id": "09-workflow-tooling/write-a-skill", "file": "09-workflow-tooling/skills/write-a-skill.md", "slug": "write-a-skill", "stage": "09-workflow-tooling", "order": 4, "step": null, "name": "Write or update a skill", "summary": "Adds a method to this repository in the shared format, so any AI can find it, trigger it correctly and know when it is finished.", "fires_when": "Adding a new method to this repository, replacing a weaker one, or turning a repeated task into a skill; \"add this to the repo\", \"make this a skill\".", "inputs": ["the source material", "templates/skill.md", "CONTRIBUTING.md"], "output": "a new or updated file in <stage>/skills/", "steps": ["Search first. Check the stage folders and `index.json` for an existing skill that covers it. Improve that one rather than adding a near-duplicate.", "Choose the stage by what the skill produces, not by the tool it uses.", "Copy `templates/skill ering. For motion craft alone use `animation-principles`; for multi-state components u", "stage": "03-ux-design", "used_by": ["04-ui-design/motion"]}, {"key": "designer-skills/interaction-design/millers-law", "repo": "designer-skills", "name": "millers-law", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/millers-law/SKILL.md", "desc": "Apply Miller's Law: chunk information into groups of about four to fit working memory. Use when grouping fields, menu items, or steps. For reducing the number of choices offered, use `hicks-law`.", "stage": "03-ux-design", "used_by": ["references/ux-laws"]}, {"key": "designer-skills/interaction-design/navigation-patterns", "repo": "designer-skills", "name": "navigation-patterns", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/navigation-patterns/SKILL.md", "desc": "Select and design a navigation pattern: tabs, drawer, hierarchy, or hub: matched to product structure and user tasks. Use when choosing how users move between sections. For the underlying content structure, use `inform", "stage": "03-ux-design", "used_by": ["03-ux-design/information-architecture"]}, {"key": "designer-skills/interaction-design/onboarding-design", "repo": "designer-skills", "name": "onboarding-design", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/onboarding-design/SKILL.md", "desc": "Design the first-run experience: activation path, progressive disclosure, and time to first value. Use for a user's very first session. For the mechanics of the signup form itself, use `form-design`.", "stage": "03-ux-design", "used_by": ["03-ux-design/wireframe-spec"]}, {"key": "designer-skills/interaction-design/peak-end-rule", "repo": "designer-skills", "name": "peak-end-rule", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/peak-end-rule/SKILL.md", "desc": "Apply the Peak-End Rule: a flow is remembered by its most intense moment and its last. Use when designing completion, celebration, or cancellation moments. For sustaining engagement mid-flow, use `zeigarnik-effect`.", "stage": "03-ux-design", "used_by": ["references/ux-laws"]}, {"key": "designer-skills/interaction-design/search-ux", "repo": "designer-skills", "name": "search-ux", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/search-ux/SKILL.md", "desc": "Design search: query input, zero results, refinement, and result presentation. Use when users retrieve rather than browse. For browse structure, use `navigation-patterns`.", "stage": "03-ux-design", "used_by": []}, {"key": "designer-skills/interaction-design/serial-position-effect", "repo": "designer-skills", "name": "serial-position-effect", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/serial-position-effect/SKILL.md", "desc": "Apply the Serial Position Effect: first and last items in a sequence are recalled best. Use when ordering menus, lists, and steps. For emphasising one item regardless of its position, use `von-restorff-effect` (ui-desig", "stage": "03-ux-design", "used_by": ["references/ux-laws"]}, {"key": "designer-skills/interaction-design/state-machine", "repo": "designer-skills", "name": "state-machine", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/state-machine/SKILL.md", "desc": "Model component behaviour as explicit states, events, and transitions. Use when a component has many interacting states that must be exhaustive. For the feel and feedback of a single interaction, use `micro-interaction-s", "stage": "03-ux-design", "used_by": ["03-ux-design/conceptual-model", "03-ux-design/states-and-errors"]}, {"key": "designer-skills/interaction-design/teslers-law", "repo": "designer-skills", "name": "teslers-law", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/interaction-design/skills/tesler hically. Owns chart selection and encoding only; the categorical colour ramp itself belongs t", "stage": "04-ui-design", "used_by": ["04-ui-design/data-visualisation"]}, {"key": "designer-skills/ui-design/illustration-style", "repo": "designer-skills", "name": "illustration-style", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/ui-design/skills/illustration-style/SKILL.md", "desc": "Define an illustration style guide: visual language, colour usage, and application rules. Use when commissioning or standardising illustration. For icons, use `icon-system` (design-systems).", "stage": "04-ui-design", "used_by": []}, {"key": "designer-skills/ui-design/law-of-closure", "repo": "designer-skills", "name": "law-of-closure", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/ui-design/skills/law-of-closure/SKILL.md", "desc": "Apply the Law of Closure: the eye completes implied shapes from partial forms. Use when reducing visual weight by dropping borders or letting negative space suggest structure. For explicit containers, use `law-of-common", "stage": "04-ui-design", "used_by": ["references/perception"]}, {"key": "designer-skills/ui-design/law-of-common-region", "repo": "designer-skills", "name": "law-of-common-region", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/ui-design/skills/law-of-common-region/SKILL.md", "desc": "Apply the Law of Common Region: a shared container, background, or border groups elements regardless of spacing. Use when grouping must survive a tight layout. For grouping by spacing alone, use `law-of-proximity`.", "stage": "04-ui-design", "used_by": ["references/perception"]}, {"key": "designer-skills/ui-design/law-of-continuity", "repo": "designer-skills", "name": "law-of-continuity", "url": "https://github.com/Owl-Listener/designer-skills/blob/main/ui-design/skills/law-of-continuity/SKILL.md", "desc": "Apply the Law of Continuity: the eye follows alignment and unbroken paths. Use when sequencing ste       " of " + nOrig + " original skills in " + Object.keys(repos).length + " repositories and " + DATA.posts.length + " posts. Open a stage to see its skills; open a skill to see its steps and where it came from.";

      onclick: () => go(id, null), text: label })));
  }

  function card(id, top, title, desc, meta, pressed, onclick) {
    return el("button", { class: "card", type: "button", id: "card-" + id, "aria-pressed": String(pressed), onclick: onclick },
      el("div", { class: "top" }, el("h3", { text: title }), top ? el("span", { class: "step", text: top }) : null),
      el("p", { text: desc }), el("div", { class: "meta" }, meta.map((m) => el("span", { text: m }))));
  }

  function grid() {
    const g = document.getElementById("grid"); g.textContent = ""; g.hidden = false;
    if (state.view === "stages") {
      stages.forEach((s) => g.append(card(s.id, s.steps.length ? "step " + s.steps.join(" & ") : "support", s.title, s.purpose,

    } else if (state.view === "sources") {

      });

    } else { g.hidden = true; }

  function setAll(open) { document.querySelectorAll("#panel details.node").forEach((d) => { d.open = open; }); }
  const toolbar = () => el("div", { class: "row" }, el("button", { class: "btn", type: "button", onclick: () => setAll(true), text: "Expand all" }),
    el("button", { class: "btn", type: "button", onclick: () => setAll(false), text: "Collapse all" }));

  function originLine(key) {
    if (posts[key]) { const p = posts[key]; return el("li", { class: "child" }, el("span", null, el("span", { class: "tag post", text: key }), link(p.url, p.title)), el("small", { text: p.author + ". Read: " + p.status })); }

  function skillNode(s, showStage) {

        el("dt", { text: "Reads" }), el("dd", null, s.inputs.length ? s.inputs.join("; ") : "the brief"),
        el("dt", { text: "Writes" }), el("dd", null, el("code", { text: s.output })),

    body.append(el("div", { class: "grp" }, el("div", { class: "glabel", text: "Built from" }), el("ul", { style: "list-style:none;padding:0;display:flex;flex-direction:column;gap:6px" }, s.draws_on.map(originLine))));
    return el("details", { class: "node" },
      el("summary", null, el("span", { class: "chev" }), el("span", { class: "num", text: String(s.order).padStart(2, "0") }),
        el("div", null, el("div", { class: "ntitle", text: s.name }), el("div", { class: "nsub", text: showStage ? stageOf(s.stage).title : s.slug })),
        el("span", { class: "count", text: s.draws_on.length + " sources" })), body);

  function stagePanel(p, id) {
    const s = stageOf(id), list = skillsIn(id), more = further(id);
    p.append(el("div", { class: "phead" }, el("h2", { text: s.title }), el("div", { class: "muted", text: s.purpose }),
      el("dl", { class: "facts" }, el("dt", { text: "Folder" }), el("dd", null, el("code", { text: id + "/" })),
        el("dt", { text: "Writes" }), el("dd", { text: s.output }), el("dt", { text: "Gate" }), el("dd", { text: s.gates.length ? s.gates.map((g) => g.gate).join(", ") : "None (support stage)" }),

        el("div", null, el("div", { class: "ntitle", text: "Not rewritten here" }), el("div", { class: "nsub", text: "Specialist or covered by a consolidated skill. Use directly for depth." })),
        el("span", { class: "count", text: String(more.length) })),
        el("div", { class: "body" }, el("ul", { style: "list-style:none;padding:0;display:flex;flex-direction:column;gap:6px" }, more.map((o) => originLine(o.key))))));
    }
  }

  function sourcePanel(p, key) {
    if (key === "posts") {
      p.append(el("div", { class: "phead" }, el("h2", { text: "Posts and articles" }), el("div", { class: "muted", text: "Each post, and the consolidated skills it informed." }), toolbar()));
      DATA.posts.forEach((po, i) => {
        const users = skills.filter((s) => s.draws_on.includes(po.id));
        p.append(el("details", { class: "node" }, el("summary", null, el("span", { class: "chev" }), el("span", { class: "num", text: po.id.slice(1) }),
          el("div", null, el("div", { class: "ntitle", text: po.title }), el("div", { class: "nsub", text: po.author })), el("span", { class: "count", text: po.quality })),
          el("div", { class: "body" }, el("p", { style: "margin:0", text: po.gist }), link(po.url, "Open source"),
            el("div", { class: "grp" }, el("div", { class: "glabel", text: "Used in" }), users.length ? el("div", { class: "chips" }, users.map((u) => el("button", { class: "chip", type: "button", text: u.name, onclick: () => go("stages", u.stage) }))) : el("span", { class: "muted", text: "Not used in a skill; kept in the register." })))));
      });
      return;
    }
    const r = repos[key], mine = originals.filter((o) => o.repo === key);
    p.append(el("div", { class: "phead" }, el("h2", { text: key }), el("div", { class: "muted", text: r.author + " (" + r.licence + "). " + r.summary }), el("div", null, link(r.url, "Open repository")), toolbar()));
    const groups = {}; mine.forEach((o) => { (groups[o.name.startsWith("layers") ? "layers" : (o.key.split("/")[1])] = groups[o.name.startsWith("layers") ? "layers" : (o.key.split("/")[1])] || []).push(o); });

      p.append(el("details", { class: "node" }, el("summary", null, el("span", { class: "chev" }), el("span", { class: "num", text: String(i + 1).padStart(2, "0") }),
        el("div", null, el("div", { class: "ntitle", text: plugin }), el("div", { class: "nsub", text: items.filter((o) => o.used_by.length).length + " of " + items.length + " used" })), el("span", { class: "count", text: String(items.length) })),
        el("div", { class: "body" }, el("ul", { style: "list-style:none;padding:0;display:flex;flex-direction:column;gap:8px" }, items.map((o) => el("li", { class: "child" },
          el("span", null, link(o.url, o.name)), el("small", { text: o.desc }),
          o.used_by.length ? el("div", { class: "chips" }, o.used_by.map((u) => { const sk = skills.find((s) => s.id === u); return el("button", { class: "chip", type: "button", text: sk ? sk.name : u, onclick: () => go("stages", sk ? sk.stage : null) }); }))
            : el("small", { text: o.stage ? "Listed under " + stageOf(o.stage).title + " as a further skill" : "Out of scope" })))))));
    });
  }

  function pipelinePanel(p) {
    p.append(el("div", { class: "phead" }, el("h2", { text: "Run a brief end to end" }),
      el("div", { class: "muted", text: "Each step reads the hand-off file before it and writes its own. A person passes each gate before the next step starts. Full instructions: playbooks/run-brief.md. For one stage only: playbooks/run-one-stage.md." })));
    const pipe = el("div", { class: "pipe" });

      pipe.append(el("div", { class: "pstep" }, el("div", { class: "prail" }, el("span", { class: "pdot", text: String(st.step) }), i < arr.length - 1 ? el("span", { class: "pline" }) : null),
        el("div", { class: "pbody" }, el("div", { class: "ntitle", text: st.title }), el("div", { class: "nsub" }, stageOf(st.stage).title + " \u00B7 writes ", el("code", { text: st.writes })),
          el("div", { class: "chips" }, ks.map((k) => el("button", { class: "chip", type: "button", text: k.name, onclick: () => go("stages", k.stage) }))),
          el("span", { class: "gate", text: st.gate }))));
    });
    p.append(pipe);
    const w = stageOf("09-workflow-tooling");
    p.append(el("h4", { text: "Support at any time" }), el("div", { class: "chips" }, skillsIn(w.id).map((k) => el("button", { class: "chip", type: "button", text: k.name, onclick: () => go("stages", w.id) }))));
  }

  function backlogPanel(p) {
    p.append(el("div", { class: "phead" }, el("h2", { text: "Not yet read" }), el("div", { class: "muted", text: "Links from the chat export still to open. Add useful ones with 09-workflow-tooling/skills/write-a-skill.md." })));
    const ul = el("ul", { class: "list" });
    DATA.backlog.forEach((b, i) => ul.append(el("li", null, el("span", { class: "num", text: String(i + 1).padStart(2, "0") }), link(b.url, b.title))));
    p.append(ul, el("h4", { text: "Unavailable" }));
    const dl = el("ul", { class: "list" });
    DATA.dead.forEach((d) => dl.append(el("li", null, el("span", { class: "num", text: "gone" }), el("span", { text: d.title + ": " + d.reason }))));
    p.append(dl);
  }

  function overview(p) {
    p.append(el("div", { class: "phead" }, el("h2", { text: state.view === "stages" ? "Pick a stage" : "Pick a source" }),
      el("div", { class: "muted", text: state.view === "stages"
        ? "Stages are listed in running order. UI design runs in two parts: foundations before the design system, screens after it, so screens are built from a system that already exists."
        : "Each repository shows its original skills and which consolidated skills they fed." })));
    if (state.view === "stages") pipelinePanel(p);
  }

  function search(p, q) {
    const hit = (t) => (t || "").toLowerCase().indexOf(q) !== -1;
    const sk = skills.filter((s) => hit(s.name + " " + s.summary + " " + s.fires_when + " " + s.steps.join(" ") + " " + s.slug));
    const og = originals.filter((o) => hit(o.name + " " + o.desc + " " + o.repo));
    p.append(el("div", { class: "phead" }, el("h2", { text: "Search results" }), el("div", { class: "muted", text: sk.length + " skills and " + og.length + " original sources match “" + state.q.trim() + "”." }), toolbar()));
    if (!sk.length && !og.length) p.append(el("div", { class: "empty", text: "Nothing matches. Try a shorter word." }));
    sk.forEach((s) => p.append(skillNode(s, true)));
    if (og.length) { p.append(el("h4", { text: "Original sources" })); p.append(el("ul", { style: "list-style:none;padding:0;display:flex;flex-direction:column;gap:6px" }, og.slice(0, 40).map((o) => originLine(o.key)))); }
  }

  function panel() {
    const p = document.getElementById("panel"); p.textContent = "";
    const q = state.q.trim().toLowerCase();

    if (state.view === "backlog") return backlogPanel(p);
    if (!state.sel) return overview(p);
    if (state.view === "stages") return stagePanel(p, state.sel);
    return sourcePanel(p, state.sel);
  }

  function setHash() {
    const token = state.sel || (state.view !== "stages" ? state.view : "");
    try { history.replaceState(null, "", token ? "#" + token : location.pathname + location.search); } catch (e) {}
  }
  function go(view, sel) { state.view = view; state.sel = sel; setHash(); render(); scrollPanel(); }
  function select(id) { state.sel = state.sel === id ? null : id; setHash(); render(); scrollPanel(); }
  function scrollPanel() {
    if (window.matchMedia("(max-width: 979px)").matches && state.sel) {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.getElementById("panel").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    }
  }
  function render() { header(); grid(); panel(); }

  document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; panel(); });
  const h = (location.hash || "").slice(1);
  if (stages.some((s) => s.id === h)) { state.view = "stages"; state.sel = h; }
  else if (repos[h] || h === "posts") { state.view = "sources"; state.sel = h; }
  else if (VIEWS.some(([v]) => v === h)) state.view = h;
  render();
})();
